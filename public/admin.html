<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 관리자 HQ통제센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
        .input-sky { background-color: #f1f5f9; border: 1px solid transparent; }
        .input-sky:focus { background-color: #ffffff; border-color: #38bdf8; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold text-slate-800 tracking-tight">silverworks <span class="text-xs px-2 py-0.5 rounded bg-sky-500 text-white">최고관리자</span></span>
            </a>
            <span class="text-xs font-bold px-3 py-1.5 rounded-full bg-sky-50 text-sky-600 border border-sky-200">
                <i class="fa-solid fa-shield-halved mr-1"></i> 최고 통제 모드
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-5 py-8 flex-1 w-full space-y-8">
        <!-- 1. 회원 가입 및 구독 승인 관리 -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-4">
            <h2 class="text-base font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users-gear text-sky-500"></i> 회원 관리 (아이디 클릭 시 상세정보 / 가입 및 구독 승인)
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-sky-50/50 border-y border-sky-100 text-slate-600 font-bold">
                            <th class="p-3">아이디 (클릭)</th>
                            <th class="p-3">성함/대표명</th>
                            <th class="p-3">회원 유형</th>
                            <th class="p-3">가입 승인</th>
                            <th class="p-3">구독 상태</th>
                            <th class="p-3 text-right">관리 통제</th>
                        </tr>
                    </thead>
                    <tbody id="user-approval-table" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <!-- 2. 구인 공고 전체 수정 및 삭제 통제 -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-4">
            <h2 class="text-base font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-sky-500"></i> 전체 공고 관리 (내용 전체 수정 / 삭제 시 시니어 자동 알림)
            </h2>
            <div id="admin-jobs-list" class="space-y-3"></div>
        </div>
    </main>

    <!-- User Detail Modal -->
    <div id="userDetailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-7 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">회원 요약 정보</h3>
                <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="user-modal-body" class="space-y-2 text-xs text-slate-700"></div>
        </div>
    </div>

    <!-- Job Edit Full Modal -->
    <div id="jobEditModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-7 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">공고 전체 내용 수정</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="saveJobEdit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="edit-job-idx">
                <div>
                    <label class="block font-bold mb-1">매장명</label>
                    <input type="text" id="edit-store" required class="w-full p-3 rounded-xl input-sky">
                </div>
                <div>
                    <label class="block font-bold mb-1">공고 제목</label>
                    <input type="text" id="edit-title" required class="w-full p-3 rounded-xl input-sky">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold mb-1">업종</label>
                        <select id="edit-category" class="w-full p-3 rounded-xl input-sky font-bold">
                            <option value="식당·서빙">식당·서빙</option>
                            <option value="카페·음료">카페·음료</option>
                            <option value="마트·운반">마트·운반</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">근무 날짜</label>
                        <input type="date" id="edit-date" required class="w-full p-3 rounded-xl input-sky">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold mb-1">근무 시간</label>
                        <input type="text" id="edit-time" required class="w-full p-3 rounded-xl input-sky">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">일당 (원)</label>
                        <input type="number" id="edit-pay" required class="w-full p-3 rounded-xl input-sky font-bold text-sky-600">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 btn-sky font-bold rounded-xl shadow mt-2">수정 내용 저장</button>
            </form>
        </div>
    </div>

    <script>
        function loadAdminControl() {
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');
            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');

            // 1. Users & Subscription Table
            const userTable = document.getElementById('user-approval-table');
            if (users.length === 0) {
                userTable.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">가입된 회원이 없습니다.</td></tr>`;
            } else {
                userTable.innerHTML = users.map((u, idx) => `
                    <tr>
                        <td class="p-3 font-mono font-bold text-sky-600 cursor-pointer hover:underline" onclick="viewUserDetail(${idx})">${u.id}</td>
                        <td class="p-3 font-bold">${u.name}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[11px] font-bold ${u.role === 'senior' ? 'bg-sky-100 text-sky-700' : 'bg-indigo-100 text-indigo-700'}">${u.role === 'senior' ? '시니어' : '사장님'}</span></td>
                        <td class="p-3"><span class="font-bold ${u.approved ? 'text-emerald-500' : 'text-amber-500'}">${u.approved ? '승인완료' : '승인대기'}</span></td>
                        <td class="p-3"><span class="font-bold ${u.isSubscribed ? 'text-sky-600' : 'text-slate-400'}">${u.isSubscribed ? '구독회원' : (u.subRequested ? '구독신청중' : '일반')}</span></td>
                        <td class="p-3 text-right space-x-1">
                            ${!u.approved ? `<button onclick="approveUser(${idx})" class="btn-sky text-[11px] px-2.5 py-1 rounded-lg font-bold">가입승인</button>` : ''}
                            ${u.role === 'employer' && u.subRequested && !u.isSubscribed ? `<button onclick="approveSub(${idx})" class="bg-emerald-500 text-white text-[11px] px-2.5 py-1 rounded-lg font-bold hover:bg-emerald-600">구독승인</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            }

            // 2. Jobs List
            const jobsList = document.getElementById('admin-jobs-list');
            if (jobs.length === 0) {
                jobsList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">등록된 공고가 없습니다.</p>`;
            } else {
                jobsList.innerHTML = jobs.map((j, idx) => `
                    <div class="p-4 rounded-2xl bg-sky-50/30 border border-sky-100 flex justify-between items-center text-xs">
                        <div>
                            <strong class="text-sm font-bold text-slate-800">${j.title}</strong>
                            <p class="text-slate-500">매장: ${j.storeName} | 일시: ${j.date} (${j.time}) | 일당: ${parseInt(j.pay).toLocaleString()}원</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openEditModal(${idx})" class="px-3 py-1.5 rounded-lg bg-sky-100 text-sky-700 font-bold hover:bg-sky-200">수정</button>
                            <button onclick="deleteJob(${idx})" class="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-600 font-bold hover:bg-rose-200">삭제</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function viewUserDetail(idx) {
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');
            const u = users[idx];
            const modalBody = document.getElementById('user-modal-body');
            
            modalBody.innerHTML = `
                <p><strong>아이디:</strong> ${u.id}</p>
                <p><strong>성함/대표자명:</strong> ${u.name}</p>
                <p><strong>연락처:</strong> ${u.phone || '미입력'}</p>
                <p><strong>회원 유형:</strong> ${u.role === 'senior' ? '시니어 구직자' : '구인 사장님'}</p>
                <p><strong>가입 승인 상태:</strong> ${u.approved ? '승인 완료' : '승인 대기중'}</p>
                <p><strong>구독 회원 여부:</strong> ${u.isSubscribed ? '구독 회원 (수수료 5% 우대)' : '일반 회원'}</p>
                <p><strong>보유 포인트:</strong> ${(u.points || 0).toLocaleString()}P</p>
                <p><strong>문진 이력서 작성 여부:</strong> ${u.hasSurvey ? '작성 완료' : '미작성'}</p>
            `;
            document.getElementById('userDetailModal').classList.remove('hidden');
        }
        function closeUserModal() { document.getElementById('userDetailModal').classList.add('hidden'); }

        function approveUser(idx) {
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');
            users[idx].approved = true;
            localStorage.setItem('sw_users', JSON.stringify(users));
            alert('가입 승인이 완료되었습니다.');
            loadAdminControl();
        }

        function approveSub(idx) {
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');
            users[idx].isSubscribed = true;
            users[idx].subRequested = false;
            localStorage.setItem('sw_users', JSON.stringify(users));
            alert('사장님의 구독이 승인되어 [구독 회원] 배지가 부여되었습니다.');
            loadAdminControl();
        }

        function openEditModal(idx) {
            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
            const j = jobs[idx];
            document.getElementById('edit-job-idx').value = idx;
            document.getElementById('edit-store').value = j.storeName;
            document.getElementById('edit-title').value = j.title;
            document.getElementById('edit-category').value = j.category || '식당·서빙';
            document.getElementById('edit-date').value = j.date;
            document.getElementById('edit-time').value = j.time;
            document.getElementById('edit-pay').value = j.pay;
            document.getElementById('jobEditModal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('jobEditModal').classList.add('hidden'); }

        function saveJobEdit(e) {
            e.preventDefault();
            const idx = document.getElementById('edit-job-idx').value;
            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
            
            jobs[idx].storeName = document.getElementById('edit-store').value;
            jobs[idx].title = document.getElementById('edit-title').value;
            jobs[idx].category = document.getElementById('edit-category').value;
            jobs[idx].date = document.getElementById('edit-date').value;
            jobs[idx].time = document.getElementById('edit-time').value;
            jobs[idx].pay = document.getElementById('edit-pay').value;

            localStorage.setItem('sw_jobs', JSON.stringify(jobs));
            alert('공고 수정이 저장되었습니다.');
            closeEditModal();
            loadAdminControl();
        }

        function deleteJob(idx) {
            if (confirm('해당 공고를 삭제하시겠습니까? 지원 및 채용된 시니어 회원들의 프로필 내역도 함께 자동 정리됩니다.')) {
                const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
                const targetJob = jobs[idx];

                if (targetJob.candidates) {
                    const notis = JSON.parse(localStorage.getItem('sw_notifications') || '[]');
                    targetJob.candidates.forEach(c => {
                        notis.unshift({
                            targetUserId: c.seniorId,
                            title: '[공고 삭제 알림]',
                            content: `지원/채용되었던 '${targetJob.title}' 공고가 삭제되었습니다.`,
                            date: new Date().toLocaleString()
                        });
                    });
                    localStorage.setItem('sw_notifications', JSON.stringify(notis));
                }

                jobs.splice(idx, 1);
                localStorage.setItem('sw_jobs', JSON.stringify(jobs));
                alert('공고가 삭제되었으며 지원 시니어들에게 알림이 발송되었습니다.');
                loadAdminControl();
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminControl);
    </script>
</body>
</html>
