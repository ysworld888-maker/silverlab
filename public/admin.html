<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="/logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 관리자 HQ통제센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; word-break: keep-all; }
        .btn-toss { background-color: #3182f6; color: #ffffff; transition: all 0.2s; }
        .btn-toss:hover { background-color: #1b64da; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(226, 232, 240, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 shadow-sm">
        <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-blue-50 text-[#3182f6]">
                    <!-- ✨ 대신 이 한 줄을 넣는 것입니다 -->
<img src="/logo.png" alt="silverworks logo" class="w-8 h-8 object-contain">
                </div>
                <span class="text-xl font-extrabold text-slate-900 tracking-tight">silverworks <span class="text-xs px-2 py-0.5 rounded bg-[#3182f6] text-white">최고관리자</span></span>
            </a>
            <span class="text-xs font-bold px-3 py-1.5 rounded-full bg-blue-50 text-[#3182f6] border border-blue-200">
                <i class="fa-solid fa-shield-halved mr-1"></i> 최고 통제 모드
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-5 py-8 flex-1 w-full space-y-8">
        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
            <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice-dollar text-[#3182f6]"></i> 사장님 수수료 정산 확인 관리 (확인 시 사장님 페이지에서 명세서 소멸)
            </h2>
            <div id="admin-invoice-list" class="space-y-3"></div>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
            <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-phone-volume text-[#3182f6]"></i> 사장님 전화 상담 문의 접수 내역
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-blue-50/50 border-y border-blue-100 text-slate-600 font-bold">
                            <th class="p-3">접수 일시</th>
                            <th class="p-3">성명</th>
                            <th class="p-3">가게명</th>
                            <th class="p-3">전화번호</th>
                        </tr>
                    </thead>
                    <tbody id="inquiry-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
            <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-users-gear text-[#3182f6]"></i> 회원 관리 (가입승인 / 구독승인 / 1~3차 경고 / 강제탈퇴)
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-blue-50/50 border-y border-blue-100 text-slate-600 font-bold">
                            <th class="p-3">아이디 (클릭)</th>
                            <th class="p-3">성함/대표명</th>
                            <th class="p-3">회원 유형</th>
                            <th class="p-3">보유 포인트 (수정)</th>
                            <th class="p-3">가입 승인</th>
                            <th class="p-3">구독 상태</th>
                            <th class="p-3 text-right">관리 통제</th>
                        </tr>
                    </thead>
                    <tbody id="user-approval-table" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
            <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-hand-holding-dollar text-amber-500"></i> 시니어 포인트 정산 요청 통제
            </h2>
            <div id="admin-settlement-list" class="space-y-3"></div>
        </div>
    </main>

    <!-- User Detail Modal -->
    <div id="userDetailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white/95 rounded-3xl max-w-md w-full p-7 space-y-4 shadow-2xl border border-white/80">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-lg font-black text-slate-900">회원 요약 정보</h3>
                <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="user-modal-body" class="space-y-2 text-xs text-slate-700"></div>
        </div>
    </div>

    <script>
        async function loadAdminControl() {
            const usersRes = await fetch('/api/users').then(r => r.json());
            const setRes = await fetch('/api/settlements').then(r => r.json());
            const inqRes = await fetch('/api/inquiries').then(r => r.json());
            const invRes = await fetch('/api/invoices').then(r => r.json());

            const users = usersRes.users || [];
            const settlements = setRes.settlements || [];
            const inquiries = inqRes.inquiries || [];
            const invoices = invRes.invoices || [];

            const invContainer = document.getElementById('admin-invoice-list');
            const pendingInvoices = invoices.filter(i => i.status === 'PENDING_ADMIN' && !i.isFullyConfirmed);
            if (pendingInvoices.length === 0) {
                invContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">사장님이 확인 요청한 수수료 명세서가 없습니다.</p>`;
            } else {
                invContainer.innerHTML = pendingInvoices.map(i => `
                    <div class="p-4 rounded-2xl bg-blue-50/50 border border-blue-100 flex justify-between items-center text-xs">
                        <div>
                            <strong class="text-sm font-bold text-slate-900">${i.storeName} (${i.jobTitle})</strong>
                            <p class="text-slate-500 mt-0.5">청구 수수료: ${i.amount.toLocaleString()}원 | 발행일시: ${i.date}</p>
                        </div>
                        <button onclick="adminConfirmInvoice('${i.id}')" class="btn-toss font-bold px-4 py-2 rounded-xl shadow-sm">
                            확인 (사장님 명세서 소멸)
                        </button>
                    </div>
                `).join('');
            }

            const inqTable = document.getElementById('inquiry-table-body');
            if (inquiries.length === 0) {
                inqTable.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">신청된 전화 상담 문의가 없습니다.</td></tr>`;
            } else {
                inqTable.innerHTML = inquiries.map(i => `
                    <tr>
                        <td class="p-3 text-slate-400">${i.date}</td>
                        <td class="p-3 font-bold text-slate-900">${i.name}</td>
                        <td class="p-3 font-bold text-[#3182f6]">${i.storeName}</td>
                        <td class="p-3 font-mono font-bold">${i.phone}</td>
                    </tr>
                `).join('');
            }

            const userTable = document.getElementById('user-approval-table');
            if (users.length === 0) {
                userTable.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">가입된 회원이 없습니다.</td></tr>`;
            } else {
                userTable.innerHTML = users.map(u => `
                    <tr>
                        <td class="p-3 font-mono font-bold text-[#3182f6] cursor-pointer hover:underline" onclick="viewUserDetail('${u.id}')">${u.id}</td>
                        <td class="p-3 font-bold">${u.name}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[11px] font-bold ${u.role === 'senior' ? 'bg-blue-100 text-[#3182f6]' : 'bg-slate-200 text-slate-700'}">${u.role === 'senior' ? '시니어' : '사장님'}</span></td>
                        <td class="p-3">
                            ${u.role === 'senior' ? `<button onclick="editSeniorPoints('${u.id}', ${u.points || 0})" class="bg-blue-50 text-[#3182f6] font-extrabold px-2 py-1 rounded border border-blue-100 hover:bg-blue-100 text-[11px]">${(u.points || 0).toLocaleString()}P <i class="fa-solid fa-pen text-[9px] ml-0.5"></i></button>` : '<span class="text-slate-300">-</span>'}
                        </td>
                        <td class="p-3"><span class="font-bold ${u.approved ? 'text-[#3182f6]' : 'text-amber-500'}">${u.approved ? '승인완료' : '승인대기'}</span></td>
                        <td class="p-3"><span class="font-bold ${u.isSubscribed ? 'text-[#3182f6]' : 'text-slate-400'}">${u.isSubscribed ? '구독회원' : (u.subRequested ? '구독신청중' : '일반')}</span></td>
                        <td class="p-3 text-right space-x-1">
                            ${!u.approved ? `<button onclick="approveUser('${u.id}')" class="btn-toss text-[11px] px-2.5 py-1 rounded-lg font-bold">승인</button>` : ''}
                            ${u.role === 'employer' && u.subRequested && !u.isSubscribed ? `<button onclick="approveSub('${u.id}')" class="btn-toss text-[11px] px-2.5 py-1 rounded-lg font-bold">구독승인</button>` : ''}
                            ${u.role === 'employer' ? `
                                <button onclick="sendWarning('${u.id}', 1)" class="bg-amber-100 text-amber-700 text-[10px] px-1.5 py-1 rounded font-bold">1차경고</button>
                                <button onclick="sendWarning('${u.id}', 2)" class="bg-amber-500 text-white text-[10px] px-1.5 py-1 rounded font-bold">2차경고</button>
                                <button onclick="sendWarning('${u.id}', 3)" class="bg-rose-500 text-white text-[10px] px-1.5 py-1 rounded font-bold">3차경고</button>
                            ` : ''}
                            <button onclick="forceDeleteUser('${u.id}')" class="bg-rose-100 text-rose-600 text-[11px] px-2 py-1 rounded-lg font-bold hover:bg-rose-200">강제탈퇴</button>
                        </td>
                    </tr>
                `).join('');
            }

            const setList = document.getElementById('admin-settlement-list');
            const pendingSettles = settlements.filter(s => s.status === 'PENDING');
            if (pendingSettles.length === 0) {
                setList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">대기 중인 정산 요청이 없습니다.</p>`;
            } else {
                setList.innerHTML = pendingSettles.map(s => `
                    <div class="p-4 rounded-2xl bg-amber-50/50 border border-amber-100 flex justify-between items-center text-xs">
                        <div>
                            <strong class="text-sm font-bold text-slate-900">${s.userName} (${s.userId})</strong>
                            <p class="text-slate-500 mt-0.5">입금계좌: ${s.bank} ${s.account} | 요청금액: ${s.amount.toLocaleString()}P</p>
                        </div>
                        <button onclick="completeSettlement('${s.id}')" class="bg-amber-500 text-white font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-amber-600">
                            정산 완료
                        </button>
                    </div>
                `).join('');
            }
        }

        async function adminConfirmInvoice(invoiceId) {
            if (confirm('해당 명세서 처리를 완료하시겠습니까? 사장님 페이지에서 명세서가 사라집니다.')) {
                await fetch('/api/invoices/admin-confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ invoiceId })
                });
                alert('명세서 처리가 완료되었습니다.');
                loadAdminControl();
            }
        }

        async function editSeniorPoints(userId, currentP) {
            const newP = prompt('수정할 보유 포인트 액수를 입력하세요:', currentP);
            if (newP !== null && !isNaN(newP)) {
                await fetch(`/api/users/${userId}/update-points`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ points: parseInt(newP, 10) })
                });
                alert('시니어 회원의 보유 포인트가 변경되었습니다.');
                loadAdminControl();
            }
        }

        async function viewUserDetail(id) {
            const usersRes = await fetch('/api/users').then(r => r.json());
            const u = usersRes.users.find(user => user.id === id);
            const modalBody = document.getElementById('user-modal-body');
            
            modalBody.innerHTML = `
                <p><strong>아이디:</strong> ${u.id}</p>
                <p><strong>성함/대표자명:</strong> ${u.name}</p>
                <p><strong>연락처:</strong> ${u.phone || '미입력'}</p>
                <p><strong>회원 유형:</strong> ${u.role === 'senior' ? '시니어 구직자' : '구인 사장님'}</p>
                <p><strong>가입 승인 상태:</strong> ${u.approved ? '승인 완료' : '승인 대기중'}</p>
                <p><strong>구독 회원 여부:</strong> ${u.isSubscribed ? '구독 회원' : '일반 회원'}</p>
                <p><strong>보유 포인트:</strong> ${(u.points || 0).toLocaleString()}P</p>
            `;
            document.getElementById('userDetailModal').classList.remove('hidden');
        }
        function closeUserModal() { document.getElementById('userDetailModal').classList.add('hidden'); }

        async function approveUser(id) {
            await fetch(`/api/users/${id}/approve`, { method: 'POST' });
            alert('가입 승인이 완료되었습니다.');
            loadAdminControl();
        }

        async function approveSub(id) {
            await fetch(`/api/users/${id}/approve-subscription`, { method: 'POST' });
            alert('사장님 구독이 승인되었습니다.');
            loadAdminControl();
        }

        async function sendWarning(userId, step) {
            if (confirm(`해당 사장님에게 ${step}차 경고 알림을 발송하시겠습니까?`)) {
                await fetch(`/api/users/${userId}/warn`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ step })
                });
                alert(`${step}차 경고 알림이 발송되었습니다.`);
            }
        }

        async function forceDeleteUser(userId) {
            if (confirm(`[주의] ${userId} 회원을 정말 강제 탈퇴(계정 삭제) 처리하시겠습니까?`)) {
                await fetch(`/api/users/${userId}`, { method: 'DELETE' });
                alert('회원이 강제 탈퇴 처리되었습니다.');
                loadAdminControl();
            }
        }

        async function completeSettlement(settleId) {
            if (confirm('정산을 완료하시겠습니까? 시니어 회원에게 알림이 전송됩니다.')) {
                await fetch(`/api/settlements/${settleId}/complete`, { method: 'POST' });
                alert('정산 완료 처리되었습니다.');
                loadAdminControl();
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminControl);
    </script>
</body>
</html>
