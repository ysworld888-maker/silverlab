<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 마이 프로필</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
        .input-sky { background-color: #f1f5f9; border: 1px solid transparent; }
        .input-sky:focus { background-color: #ffffff; border-color: #38bdf8; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <!-- User Header Card -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center text-2xl font-black border border-sky-200">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="profile-name" class="text-xl font-black text-slate-800">회원 성함</h1>
                        <span id="sub-badge-display"></span>
                    </div>
                    <span id="profile-role" class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-0.5 rounded-lg border border-sky-100">회원 유형</span>
                </div>
            </div>
            
            <div id="senior-points-box" class="hidden bg-sky-50/80 p-4 rounded-2xl border border-sky-100 flex items-center gap-4 w-full sm:w-auto justify-between">
                <div>
                    <span class="text-[11px] font-bold text-slate-400 block">보유 포인트</span>
                    <strong id="profile-points" class="text-lg font-black text-sky-600">0P</strong>
                </div>
                <button onclick="openSubModal()" class="btn-sky text-xs font-bold px-4 py-2 rounded-xl shadow-sm">정산 신청</button>
            </div>
        </div>

        <div id="role-dashboard" class="space-y-6"></div>
    </main>

    <!-- Cancel Hire Modal -->
    <div id="cancelHireModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-7 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">채용 취소 및 본사 신고</h3>
                <button onclick="closeCancelModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="cancel-job-id">
            <input type="hidden" id="cancel-senior-id">
            <p class="text-xs text-slate-600 leading-relaxed">
                채용 취소를 실행하시면 1순위 지원자의 채용이 취소되며, <strong>2순위(3순위) 지원자에게 자동 승계 알림이 발송</strong>됩니다. (2순위 시급당 +1,000원, 3순위 +2,000원 추가 가산)
            </p>
            <div class="p-3.5 bg-rose-50 rounded-xl border border-rose-100 flex items-start gap-2 text-xs">
                <input type="checkbox" id="cancel-agree-check" class="mt-0.5 rounded text-rose-600">
                <label for="cancel-agree-check" class="text-rose-700 font-bold cursor-pointer">
                    지원자 노쇼/근무 불가에 따른 채용 취소에 동의하며 본사 신고를 접수합니다.
                </label>
            </div>
            <button onclick="confirmCancelHire()" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-xs shadow">
                채용 취소 및 승계 실행
            </button>
        </div>
    </div>

    <!-- Soft Blue Point Pay Agreement Modal (Accidental Transfer Prevention) -->
    <div id="payPointModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-7 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">시니어 근무 대가 포인트 지급</h3>
                <button onclick="closePayModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="pay-job-id">
            <input type="hidden" id="pay-senior-id">
            <input type="hidden" id="pay-amount">
            <p class="text-xs text-slate-600 leading-relaxed">
                시니어 회원의 실제 근무 확인 후 포인트를 지급합니다. 실수 지급 방지를 위해 아래 동의란을 체크해 주세요.
            </p>
            <div class="p-3.5 bg-sky-50 rounded-xl border border-sky-100 flex items-start gap-2 text-xs">
                <input type="checkbox" id="pay-agree-check" class="mt-0.5 rounded text-sky-600">
                <label for="pay-agree-check" class="text-sky-800 font-bold cursor-pointer">
                    시니어 회원의 근무 수행을 확인하였으며 포인트 지급에 동의합니다.
                </label>
            </div>
            <button onclick="confirmPayPoint()" class="w-full py-3.5 bg-sky-400 hover:bg-sky-500 text-white font-bold rounded-xl text-xs shadow">
                지급하기
            </button>
        </div>
    </div>

    <!-- Settlement Modal -->
    <div id="subModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-7 space-y-5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">포인트 현금 정산 신청</h3>
                <button onclick="closeSubModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleSettlement(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">입금 은행</label>
                    <select id="settle-bank" class="w-full p-3.5 rounded-xl input-sky font-bold">
                        <option value="신한은행">신한은행</option>
                        <option value="우리은행">우리은행</option>
                        <option value="하나은행">하나은행</option>
                        <option value="카카오뱅크">카카오뱅크</option>
                        <option value="KB국민은행">KB국민은행</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">입금 계좌번호</label>
                    <input type="text" id="settle-account" placeholder="계좌번호 (- 없이 숫자만 입력)" required class="w-full p-3.5 rounded-xl input-sky font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">정산 요청 금액 (P)</label>
                    <input type="number" id="settle-amount" placeholder="0" required class="w-full p-3.5 rounded-xl input-sky font-bold text-sky-600">
                </div>
                <button type="submit" class="w-full py-3.5 btn-sky font-bold rounded-xl shadow">정산 신청 제출</button>
            </form>
        </div>
    </div>

    <script>
        async function renderProfile() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            if (!user) {
                alert('로그인이 필요한 페이지입니다.');
                location.href = '/login.html';
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            document.getElementById('profile-name').innerText = freshUser.name;
            document.getElementById('profile-role').innerText = freshUser.role === 'senior' ? '시니어 구직자 회원' : '구인 사업장 사장님';
            
            if (freshUser.isSubscribed) {
                document.getElementById('sub-badge-display').innerHTML = `<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-md border border-amber-200">구독 회원</span>`;
            }

            if (freshUser.role === 'senior') {
                document.getElementById('senior-points-box').classList.remove('hidden');
                document.getElementById('profile-points').innerText = (freshUser.points || 0).toLocaleString() + 'P';
            }

            const dashboard = document.getElementById('role-dashboard');

            if (freshUser.role === 'senior') {
                // Senior Profile
                const surveysRes = await fetch('/api/surveys').then(r => r.json());
                const mySurvey = (surveysRes.surveys || []).find(s => s.seniorId === freshUser.id);

                const jobsRes = await fetch('/api/jobs').then(r => r.json());
                const applied = (jobsRes.jobs || []).filter(j => j.candidates && j.candidates.some(c => c.seniorId === freshUser.id));

                let html = '';

                if (mySurvey) {
                    html += `
                        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-4">
                            <h2 class="text-base font-black text-slate-800 border-b border-sky-100 pb-3 flex items-center justify-between">
                                <span><i class="fa-solid fa-file-medical text-sky-500 mr-2"></i>내 건강 문진표 양식</span>
                                <span class="text-xs text-slate-400 font-normal">${mySurvey.date}</span>
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>도우미:</strong> ${mySurvey.answers.q1 || '본인'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>생년월일:</strong> ${mySurvey.answers.birth || '미입력'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>연락처:</strong> ${mySurvey.phone || '미입력'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>희망 동네:</strong> ${mySurvey.location || '미입력'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>3층 계단:</strong> ${mySurvey.stairs || '보통'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>1시간 보행:</strong> ${mySurvey.answers.walk || '가능'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>지병 여부:</strong> ${mySurvey.answers.disease || '건강함'}</div>
                                <div class="p-3 bg-sky-50/50 rounded-xl"><strong>식당 소음 청력:</strong> ${mySurvey.answers.hearing || '양호'}</div>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-4">
                        <h2 class="text-base font-black text-slate-800 border-b border-sky-100 pb-3"><i class="fa-solid fa-briefcase text-sky-500 mr-2"></i>내 구직 신청 및 채용 현황</h2>
                `;

                if (applied.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-8">아직 지원하신 피크타임 일자리가 없습니다.</p>`;
                } else {
                    html += applied.map(j => {
                        const myCand = j.candidates.find(c => c.seniorId === freshUser.id);
                        return `
                            <div class="p-4 rounded-2xl bg-sky-50/40 border border-sky-100 flex justify-between items-center text-xs">
                                <div>
                                    <strong class="text-sm font-bold text-slate-800">${j.title} (${j.storeName})</strong>
                                    <p class="text-slate-500 mt-1">근무일: ${j.date} (${j.time}) | 일당: ${parseInt(j.pay).toLocaleString()}원</p>
                                </div>
                                <span class="font-bold text-sky-600 bg-sky-100/70 px-3 py-1 rounded-full">${myCand.status}</span>
                            </div>
                        `;
                    }).join('');
                }
                html += `</div>`;
                dashboard.innerHTML = html;

            } else {
                // Employer Profile
                const jobsRes = await fetch('/api/jobs').then(r => r.json());
                const myJobs = (jobsRes.jobs || []).filter(j => j.employerId === freshUser.id);

                let html = `
                    <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-6">
                        <h2 class="text-base font-black text-slate-800 border-b border-sky-100 pb-3"><i class="fa-solid fa-users text-sky-500 mr-2"></i>공고별 지원자 1·2·3순위 지정 / 채용 / 채용취소 / 포인트 지급</h2>
                `;

                if (myJobs.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-8">등록하신 구인 공고가 없습니다.</p>`;
                } else {
                    html += myJobs.map(j => `
                        <div class="p-5 rounded-2xl bg-sky-50/30 border border-sky-100 space-y-3 text-xs">
                            <div class="flex justify-between items-center border-b border-sky-100 pb-2">
                                <strong class="text-sm font-bold text-slate-800">${j.title} (${j.storeName})</strong>
                                <span class="font-bold text-sky-600 bg-sky-100 px-3 py-0.5 rounded-full">${j.status}</span>
                            </div>
                            <div class="space-y-2">
                                <span class="font-bold text-slate-500">지원자 명단 (${(j.candidates || []).length}명)</span>
                                ${(j.candidates || []).length === 0 ? '<p class="text-slate-400 py-2">지원자가 아직 없습니다.</p>' : 
                                    j.candidates.map(c => `
                                        <div class="p-3 rounded-xl bg-white border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                            <div>
                                                <strong class="text-slate-800 font-bold">${c.name}</strong> (${c.phone})
                                                <span class="text-[11px] text-sky-600 block pt-0.5">${c.status}</span>
                                            </div>
                                            <div class="flex items-center gap-1.5 flex-wrap">
                                                <select onchange="assignRank('${j.id}', '${c.seniorId}', this.value)" class="p-1.5 rounded border border-slate-200 text-[11px]">
                                                    <option value="">순위 선택</option>
                                                    <option value="1순위">1순위</option>
                                                    <option value="2순위">2순위</option>
                                                    <option value="3순위">3순위</option>
                                                </select>
                                                <button onclick="hireCandidate('${j.id}', '${c.seniorId}')" class="btn-sky px-2.5 py-1.5 rounded-lg font-bold text-[11px]">채용확정</button>
                                                <button onclick="openCancelModal('${j.id}', '${c.seniorId}')" class="bg-rose-100 text-rose-600 px-2.5 py-1.5 rounded-lg font-bold text-[11px] hover:bg-rose-200">채용취소</button>
                                                <!-- Light Blue Point Pay Button -->
                                                <button onclick="openPayModal('${j.id}', '${c.seniorId}', ${j.pay})" class="bg-sky-400 text-white px-2.5 py-1.5 rounded-lg font-bold text-[11px] hover:bg-sky-500">포인트지급</button>
                                            </div>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    `).join('');
                }
                html += `</div>`;
                dashboard.innerHTML = html;
            }
        }

        function openCancelModal(jobId, seniorId) {
            document.getElementById('cancel-job-id').value = jobId;
            document.getElementById('cancel-senior-id').value = seniorId;
            document.getElementById('cancel-agree-check').checked = false;
            document.getElementById('cancelHireModal').classList.remove('hidden');
        }
        function closeCancelModal() { document.getElementById('cancelHireModal').classList.add('hidden'); }

        async function confirmCancelHire() {
            const isAgreed = document.getElementById('cancel-agree-check').checked;
            if (!isAgreed) {
                alert('본사 접수 동의 체크박스에 동의해 주셔야 채용 취소 및 승계가 진행됩니다.');
                return;
            }

            const jobId = document.getElementById('cancel-job-id').value;
            const seniorId = document.getElementById('cancel-senior-id').value;

            await fetch(`/api/jobs/${jobId}/cancel-hire`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seniorId })
            }).then(r => r.json());

            closeCancelModal();

            alert('회사에 신고(노쇼 접수)가 정상 처리되었습니다.\n다음 순위 지원자에게 자동 승계 채용 알림이 발송되었습니다.');
            renderProfile();
        }

        function openPayModal(jobId, seniorId, amount) {
            document.getElementById('pay-job-id').value = jobId;
            document.getElementById('pay-senior-id').value = seniorId;
            document.getElementById('pay-amount').value = amount;
            document.getElementById('pay-agree-check').checked = false;
            document.getElementById('payPointModal').classList.remove('hidden');
        }
        function closePayModal() { document.getElementById('payPointModal').classList.add('hidden'); }

        async function confirmPayPoint() {
            const isAgreed = document.getElementById('pay-agree-check').checked;
            if (!isAgreed) {
                alert('시니어 회원의 근무 확인 동의란을 체크해 주셔야 포인트 지급이 가능합니다.');
                return;
            }

            const jobId = document.getElementById('pay-job-id').value;
            const seniorId = document.getElementById('pay-senior-id').value;
            const basePay = document.getElementById('pay-amount').value;

            await fetch(`/api/jobs/${jobId}/pay-points`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seniorId, basePay })
            });

            closePayModal();
            alert('시니어 회원에게 포인트 지급이 정상 완료되었습니다.');
            renderProfile();
        }

        async function assignRank(jobId, seniorId, rank) {
            if (!rank) return;
            await fetch(`/api/jobs/${jobId}/rank`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seniorId, rank })
            });
            alert(`${rank} 지정 완료 및 시니어에게 알림이 발송되었습니다.`);
            renderProfile();
        }

        async function hireCandidate(jobId, seniorId) {
            await fetch(`/api/jobs/${jobId}/hire`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seniorId })
            });
            alert('채용 확정 및 시니어 회원에게 알림이 발송되었습니다.');
            renderProfile();
        }

        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const hasUnread = notiRes.hasUnread;

            let html = `
                <a href="/notifications.html" class="relative p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    ${hasUnread ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-sky-500 rounded-full ring-2 ring-white"></span>` : ''}
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <button onclick="openSubModal()" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </button>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        function openSubModal() { document.getElementById('subModal').classList.remove('hidden'); }
        function closeSubModal() { document.getElementById('subModal').classList.add('hidden'); }

        async function handleSettlement(e) {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('sw_user') || '{}');
            const bank = document.getElementById('settle-bank').value;
            const account = document.getElementById('settle-account').value;
            const amount = parseInt(document.getElementById('settle-amount').value, 10);

            const res = await fetch('/api/settlements', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, userName: user.name, bank, account, amount })
            }).then(r => r.json());

            if (res.success) {
                alert(`[정산 신청 완료]\n\n${bank} ${account}\n요청 금액: ${amount.toLocaleString()}P\n\n관리자 승인 후 포인트가 최종 차감됩니다.`);
                closeSubModal();
                renderProfile();
            } else {
                alert(res.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            renderProfile();
        });
    </script>
</body>
</html>
