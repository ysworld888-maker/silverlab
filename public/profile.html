<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 마이 프로필</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
        .input-sky { background-color: #f1f5f9; border: 1px solid transparent; }
        .input-sky:focus { background-color: #ffffff; border-color: #38bdf8; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <!-- User Info Header -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center text-2xl font-black border border-sky-200">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h1 id="profile-name" class="text-xl font-black text-slate-800">회원 성함</h1>
                    <span id="profile-role" class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-0.5 rounded-lg border border-sky-100">회원 유형</span>
                </div>
            </div>
            <div class="bg-sky-50/80 p-4 rounded-2xl border border-sky-100 flex items-center gap-4 w-full sm:w-auto justify-between">
                <div>
                    <span class="text-[11px] font-bold text-slate-400 block">보유 잔액</span>
                    <strong id="profile-points" class="text-lg font-black text-sky-600">0P</strong>
                </div>
                <button onclick="openSubModal()" class="btn-sky text-xs font-bold px-4 py-2 rounded-xl shadow-sm">정산하기</button>
            </div>
        </div>

        <!-- Dynamic Role Content Section -->
        <div id="role-dashboard" class="space-y-6"></div>
    </main>

    <!-- Settlement Modal -->
    <div id="subModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-7 space-y-5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                <h3 class="text-lg font-black text-slate-800">포인트 현금 정산 신청</h3>
                <button onclick="closeSubModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleSettlement(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">입금 은행</label>
                    <select id="settle-bank" class="w-full p-3.5 rounded-xl input-sky font-bold">
                        <option value="신한은행">신한은행</option>
                        <option value="우리은행">우리은행</option>
                        <option value="하나은행">하나은행</option>
                        <option value="카카오뱅크">카카오뱅크</option>
                        <option value="KB국민은행">KB국민은행</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">입금 계좌번호</label>
                    <input type="text" id="settle-account" placeholder="계좌번호 (- 없이 숫자만 입력)" required class="w-full p-3.5 rounded-xl input-sky font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">정산 요청 금액 (P)</label>
                    <input type="number" id="settle-amount" placeholder="0" required class="w-full p-3.5 rounded-xl input-sky font-bold text-sky-600">
                </div>
                <button type="submit" class="w-full py-3.5 btn-sky font-bold rounded-xl shadow">정산 신청하기</button>
            </form>
        </div>
    </div>

    <script>
        function renderProfile() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            if (!user) {
                alert('로그인이 필요한 페이지입니다.');
                location.href = '/login.html';
                return;
            }

            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('profile-role').innerText = user.role === 'senior' ? '시니어 구직자 회원' : '구인 사업장 사장님';
            
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);
            document.getElementById('profile-points').innerText = points.toLocaleString() + 'P';

            const dashboard = document.getElementById('role-dashboard');

            if (user.role === 'senior') {
                // Senior Dashboard
                const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
                const applied = jobs.filter(j => j.candidates && j.candidates.some(c => c.seniorId === user.id));

                let html = `
                    <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-4">
                        <h2 class="text-base font-black text-slate-800"><i class="fa-solid fa-briefcase text-sky-500 mr-2"></i>내 구직 신청 및 채용 현황</h2>
                `;

                if (applied.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-8">아직 지원한 피크타임 일자리가 없습니다.</p>`;
                } else {
                    html += applied.map(j => {
                        const myCand = j.candidates.find(c => c.seniorId === user.id);
                        return `
                            <div class="p-4 rounded-2xl bg-sky-50/40 border border-sky-100 flex justify-between items-center text-xs">
                                <div>
                                    <strong class="text-sm font-bold text-slate-800">${j.title}</strong>
                                    <p class="text-slate-500 mt-1">근무일: ${j.date} (${j.time}) | 일당: ${parseInt(j.pay).toLocaleString()}원</p>
                                </div>
                                <span class="font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">${myCand.status}</span>
                            </div>
                        `;
                    }).join('');
                }
                html += `</div>`;
                dashboard.innerHTML = html;

            } else {
                // Employer Dashboard: Applicants & Hiring & Points Transfer
                const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
                let html = `
                    <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-6">
                        <h2 class="text-base font-black text-slate-800"><i class="fa-solid fa-users text-sky-500 mr-2"></i>내 공고 지원자 순위 지정 및 채용/포인트 지급</h2>
                `;

                if (jobs.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-8">등록된 구인 공고가 없습니다.</p>`;
                } else {
                    html += jobs.map((j, jIdx) => `
                        <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-3 text-xs">
                            <div class="flex justify-between items-center border-b border-slate-200/60 pb-2">
                                <strong class="text-sm font-bold text-slate-800">${j.title} (${j.storeName})</strong>
                                <span class="font-bold text-sky-600">${j.status}</span>
                            </div>
                            <div class="space-y-2">
                                <span class="font-bold text-slate-500">지원자 명단 (${(j.candidates || []).length}명)</span>
                                ${(j.candidates || []).length === 0 ? '<p class="text-slate-400 py-2">지원자가 아직 없습니다.</p>' : 
                                    j.candidates.map((c, cIdx) => `
                                        <div class="p-3 rounded-xl bg-white border border-slate-200 flex justify-between items-center">
                                            <div>
                                                <strong class="text-slate-800 font-bold">${c.name}</strong> (${c.phone})
                                                <span class="text-[10px] text-sky-600 block pt-0.5">${c.status}</span>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <select onchange="assignRank(${jIdx}, ${cIdx}, this.value)" class="p-1.5 rounded border border-slate-200 text-[11px]">
                                                    <option value="">순위 선택</option>
                                                    <option value="1순위">1순위</option>
                                                    <option value="2순위">2순위</option>
                                                    <option value="3순위">3순위</option>
                                                </select>
                                                <button onclick="hireCandidate('${c.seniorId}', '${j.title}', ${j.pay})" class="btn-sky px-3 py-1.5 rounded-lg font-bold text-[11px]">채용 확정</button>
                                                <button onclick="payPointToSenior('${c.seniorId}', ${j.pay})" class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold text-[11px] hover:bg-emerald-600">포인트 지급</button>
                                            </div>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    `).join('');
                }
                html += `</div>`;
                dashboard.innerHTML = html;
            }
        }

        function assignRank(jIdx, cIdx, rank) {
            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
            jobs[jIdx].candidates[cIdx].status = `${rank} 지정 완료`;
            localStorage.setItem('sw_jobs', JSON.stringify(jobs));
            alert(`${rank}로 지정되었습니다.`);
            renderProfile();
        }

        function hireCandidate(seniorId, jobTitle, pay) {
            // Push Notification
            const notis = JSON.parse(localStorage.getItem('sw_notifications') || '[]');
            notis.unshift({
                targetUserId: seniorId,
                title: '[채용 확정 알림]',
                content: `'${jobTitle}' 공고에 최종 채용되었습니다! 출근에 차질 없으시길 바랍니다.`,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('sw_notifications', JSON.stringify(notis));

            alert('선택한 시니어 회원 채용이 확정되었으며 알림이 발송되었습니다!');
            renderProfile();
        }

        function payPointToSenior(seniorId, pay) {
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');
            const idx = users.findIndex(u => u.id === seniorId);
            
            if (idx !== -1) {
                users[idx].points = (users[idx].points || 0) + parseInt(pay);
                localStorage.setItem('sw_users', JSON.stringify(users));

                // If currently logged in as that senior, sync sw_points
                const cur = JSON.parse(localStorage.getItem('sw_user') || '{}');
                if (cur.id === seniorId) {
                    localStorage.setItem('sw_points', users[idx].points.toString());
                }

                alert(`시니어 회원에게 근무 대가 (${parseInt(pay).toLocaleString()}P) 포인트 지급이 완료되었습니다!`);
            } else {
                alert('해당 회원을 찾을 수 없습니다.');
            }
        }

        function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);

            let html = `
                <a href="/notifications.html" class="p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (user) {
                html += `
                    <button onclick="openSubModal()" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${points.toLocaleString()}P (정산)
                    </button>
                    <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                        <i class="fa-solid fa-user"></i>
                    </a>
                    <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
                `;
            } else {
                html += `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
            }
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        function openSubModal() { document.getElementById('subModal').classList.remove('hidden'); }
        function closeSubModal() { document.getElementById('subModal').classList.add('hidden'); }

        function handleSettlement(e) {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('sw_user') || '{}');
            const bank = document.getElementById('settle-bank').value;
            const account = document.getElementById('settle-account').value;
            const amount = document.getElementById('settle-amount').value;

            const curP = parseInt(localStorage.getItem('sw_points') || '0', 10);
            if (parseInt(amount) > curP) {
                alert('보유 포인트보다 많은 금액을 정산 신청할 수 없습니다.');
                return;
            }

            const settles = JSON.parse(localStorage.getItem('sw_settlements') || '[]');
            settles.unshift({ userId: user.id, userName: user.name, bank, account, amount, date: new Date().toLocaleString() });
            localStorage.setItem('sw_settlements', JSON.stringify(settles));

            localStorage.setItem('sw_points', (curP - parseInt(amount)).toString());

            alert(`[정산 신청 완료]\n\n${bank} ${account}\n요청 금액: ${parseInt(amount).toLocaleString()}P\n\n확인 후 처리됩니다.`);
            closeSubModal();
            renderProfile();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            renderProfile();
        });
    </script>
</body>
</html>
