<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 구직 베테랑 건강 문진 이력서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f2f4f6; color: #191f28; word-break: keep-all; }
        .btn-toss { background-color: #3182f6; color: #ffffff; transition: all 0.2s; }
        .btn-toss:hover { background-color: #1b64da; }
        .input-toss { background-color: #ffffff; border: 1px solid #e5e8eb; }
        .input-toss:focus { border-color: #3182f6; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1 rounded-xl bg-blue-50 text-blue-600">
                    <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-lg font-extrabold text-slate-900">silverworks</span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-10 px-5">
        <div class="w-full max-w-lg bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl space-y-6 text-center">
            
            <!-- Visual Progress Gauge Bar -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                    <span>문진 진행률</span>
                    <span id="step-indicator" class="text-blue-600">1 / 12</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-300 rounded-full" style="width: 8.33%;"></div>
                </div>
            </div>

            <h2 class="text-xl font-bold text-slate-900">구직 베테랑 건강 문진 이력서</h2>

            <!-- Question Body -->
            <div id="wizard-content" class="text-left space-y-4 pt-1"></div>

            <!-- Navigation Buttons -->
            <div class="pt-4 flex gap-3">
                <button type="button" onclick="prevStep()" id="prev-btn" class="flex-1 py-3.5 border border-slate-200 font-bold text-xs rounded-xl text-slate-600 hover:bg-slate-50 transition hidden">
                    이전 질문
                </button>
                <button type="button" onclick="nextStep()" id="next-btn" class="flex-1 py-3.5 btn-toss font-bold text-xs rounded-xl shadow-md">
                    다음 단계
                </button>
            </div>
        </div>
    </main>

    <script>
        const questions = [
            { id: "q1", q: "1. 오늘 이 일자리 신청은 누가 도와주고 계시나요?", type: "radio", options: ["어르신 본인이 직접 스마트폰을 보고 있어요.", "아들, 딸, 손주 등 가족이 대신 눌러주고 있어요.", "주변 사람의 도움을 받고 있어요."] },
            { id: "name", q: "2. 성함이 어떻게 되시나요?", type: "text", placeholder: "성함 입력" },
            { id: "birth", q: "3. 생년월일을 입력해 주세요.", type: "text", placeholder: "예: 19580101" },
            { id: "phone", q: "4. 휴대전화 번호를 적어주세요.", type: "tel", placeholder: "010-0000-0000" },
            { id: "location", q: "5. 근무를 희망하는 동네 이름을 적어주세요. (ex. 성남시 분당구)", type: "text", placeholder: "희망 지역 입력" },
            { id: "stairs", q: "7. 아파트나 지하철 계단을 이용할 때, 쉬지 않고 3층 높이까지 걸어서 올라가실 수 있습니까?", type: "radio", options: ["네, 숨차지 않고 잘 올라갑니다.", "무릎이나 허리가 조금 쑤시지만 올라갑니다.", "관절이 아파서 계단 이용이 힘듭니다."] },
            { id: "walk", q: "8. 가볍게 1시간 걸을 수 있습니까?", type: "radio", options: ["네", "아니요"] },
            { id: "disease", q: "8-2. 현장에서 조심해야 할 지병이 있으십니까?", type: "radio", options: ["아주 건강합니다.", "네, 하지만 일 하는데 문제 없습니다.", "주기적으로 통증이 오거나 병원 치료 중입니다."] },
            { id: "hearing", q: "9. 시끄러운 식당이나 마트 안에서도 지시 사항이나 주문 소리를 잘 들으실 수 있습니까?", type: "radio", options: ["네, 귀가 밝아서 잘 들립니다.", "가끔 안 들릴 때가 있지만 소통에 문제없습니다.", "귀가 조금 어두워 큰 소리로 말씀해 주셔야 합니다."] },
            { id: "kakao", q: "10. 평소 스마트폰으로 자녀분들과 카카오톡 메시지를 주고 받으실 때 어려움을 겪습니까?", type: "radio", options: ["아니요, 문제 없습니다.", "네, 조금 어렵습니다."] },
            { id: "worktime", q: "11. 실버웍스는 하루에 2~3시간씩 일하는 초단기 일자리를 주로 연결해 드립니다.", type: "radio", options: ["네, 이해했습니다.", "되도록이면 더 길게 일하고 싶습니다."] },
            { id: "govJob", q: "13. 올해 (2026) 정부에서 제공하는 노인 일자리 사업에 참여하신 적이 있습니까?", type: "radio", options: ["없습니다. (잘 모르겠습니다.)", "있습니다."] }
        ];

        let currentStep = 0;
        const answers = {};

        function renderStep() {
            const item = questions[currentStep];
            const container = document.getElementById('wizard-content');
            
            // Gauge Bar Update
            const total = questions.length;
            const pct = ((currentStep + 1) / total) * 100;
            document.getElementById('step-indicator').innerText = `${currentStep + 1} / ${total}`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            let html = `<label class="block font-bold text-slate-800 text-sm mb-3">${item.q}</label>`;

            if (item.type === "radio") {
                html += `<div class="space-y-2">`;
                item.options.forEach((opt) => {
                    const isSelected = answers[item.id] === opt;
                    html += `
                        <div onclick="selectRadio('${item.id}', '${opt}')" class="p-3.5 rounded-xl border border-slate-200 text-xs font-medium cursor-pointer hover:border-blue-500 transition ${isSelected ? 'border-blue-600 bg-blue-50/60 text-blue-600 font-bold' : 'bg-white text-slate-700'}">
                            ${opt}
                        </div>
                    `;
                });
                html += `</div>`;
                document.getElementById('next-btn').classList.add('hidden');
            } else {
                const val = answers[item.id] || '';
                html += `<input type="${item.type}" id="step-input" value="${val}" placeholder="${item.placeholder}" oninput="answers['${item.id}'] = this.value" class="w-full p-3.5 rounded-xl input-toss text-xs font-medium">`;
                document.getElementById('next-btn').classList.remove('hidden');
            }

            container.innerHTML = html;
            document.getElementById('prev-btn').classList.toggle('hidden', currentStep === 0);
            document.getElementById('next-btn').innerText = currentStep === questions.length - 1 ? "제출 완료" : "다음 단계";
        }

        function selectRadio(key, val) {
            answers[key] = val;
            renderStep();
            setTimeout(() => {
                nextStep();
            }, 200);
        }

        function nextStep() {
            if (currentStep < questions.length - 1) {
                currentStep++;
                renderStep();
            } else {
                // Save to localStorage for Admin Sync
                const surveys = JSON.parse(localStorage.getItem('sw_surveys') || '[]');
                surveys.unshift({ ...answers, date: new Date().toLocaleString() });
                localStorage.setItem('sw_surveys', JSON.stringify(surveys));

                alert('건강 문진 이력서 작성이 완료되었습니다. 검증 후 순차 연락드리겠습니다.');
                window.location.href = '/index.html';
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user'));
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);

            let html = `
                <a href="/notifications.html" class="p-2 text-slate-500 hover:text-blue-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (user) {
                html += `
                    <button onclick="alert('정산 페이지로 이동합니다.')" class="text-xs font-extrabold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition">
                        포인트 ${points.toLocaleString()}P (정산)
                    </button>
                    <a href="/senior-apply.html" class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-700 font-bold border border-slate-300 hover:border-blue-500 transition" title="프로필 페이지">
                        <i class="fa-solid fa-user"></i>
                    </a>
                `;
            } else {
                html += `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-blue-600 text-white shadow-sm">로그인 및 회원가입</a>`;
            }
            userArea.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            renderStep();
        });
    </script>
</body>
</html>
