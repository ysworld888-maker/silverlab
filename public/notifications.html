<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 알림 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-5 py-10 flex-1 w-full space-y-6">
        <div class="border-b border-sky-100 pb-5">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">알림 센터</h1>
            <p class="text-xs text-slate-500 mt-1">순위 지정, 승계 및 채용/포인트 지급 알림 내역</p>
        </div>

        <div id="notification-list" class="space-y-3"></div>
    </main>

    <script>
        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            await fetch(`/api/notifications/${user.id}/read`, { method: 'POST' });

            let html = `
                <a href="/notifications.html" class="relative p-2 text-sky-600 bg-sky-50 rounded-full transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        async function loadNotifications() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            const notiContainer = document.getElementById('notification-list');

            if (!user) {
                notiContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">로그인이 필요합니다.</p>`;
                return;
            }

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const myNotis = notiRes.notifications || [];

            if (myNotis.length === 0) {
                notiContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-400 bg-white rounded-3xl border border-sky-100">
                        <i class="fa-solid fa-bell-slash text-3xl mb-2 text-sky-300"></i>
                        <p class="text-xs font-bold">새로운 알림이 없습니다.</p>
                    </div>`;
            } else {
                notiContainer.innerHTML = myNotis.map(n => `
                    <div class="p-5 rounded-2xl bg-sky-50/50 border border-sky-100 flex justify-between items-start text-xs space-y-1">
                        <div>
                            <strong class="text-slate-800 font-bold block text-sm">${n.title}</strong>
                            <p class="text-slate-600 mt-1">${n.content}</p>
                            <span class="text-[10px] text-slate-400 block pt-1">${n.date}</span>
                        </div>
                        <button onclick="deleteNotification('${n.id}')" class="text-[10px] text-slate-400 hover:text-rose-500 font-bold px-2 py-0.5 rounded border border-slate-200">
                            삭제
                        </button>
                    </div>
                `).join('');
            }
        }

        async function deleteNotification(id) {
            await fetch(`/api/notifications/item/${id}`, { method: 'DELETE' });
            loadNotifications();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            loadNotifications();
        });
    </script>
</body>
</html>
