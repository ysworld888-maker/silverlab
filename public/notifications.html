<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 알림 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f9fafb; color: #191f28; word-break: keep-all; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-blue-50 text-blue-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900">silverworks</span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-5 py-10 flex-1 w-full space-y-6">
        <div class="border-b border-slate-200 pb-5">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">알림 센터</h1>
            <p class="text-xs text-slate-500 mt-1">2순위 자동 승계, 체력검증 배지 승인, 실시간 알림 내역</p>
        </div>

        <div class="space-y-3" id="notification-list">
            <div class="p-8 text-center text-slate-400 bg-white rounded-3xl border border-slate-200/80">
                <i class="fa-solid fa-bell-slash text-3xl mb-2 text-slate-300"></i>
                <p class="text-xs font-bold">새로운 알림이 없습니다.</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 text-center px-5">
        <p>실버웍스 (silverworks), 대표 유연성 010-7464-3657, 대표 민 혁 010-9187-9074, 주소: 경기도 성남시 중원구 광명로 79, 4층 404호 (성남동, 상산빌딩), 사업자등록 번호 : 726-19-02892, 주업종: 경영컨설팅업 (전문, 과학 및 기술서비스업) (업종코드 : 741400) | 부업종: 데이터베이스 및 온라인 정보 제공업 (업종코드 : 724000)</p>
    </footer>

    <script>
        function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user'));
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);

            let html = `
                <a href="/notifications.html" class="p-2 text-blue-600 bg-blue-50 rounded-full transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (user) {
                html += `
                    <button onclick="alert('정산 페이지로 이동합니다.')" class="text-xs font-extrabold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition">
                        포인트 ${points.toLocaleString()}P (정산)
                    </button>
                    <a href="/senior-apply.html" class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-700 font-bold border border-slate-300 hover:border-blue-500 transition" title="프로필 페이지">
                        <i class="fa-solid fa-user"></i>
                    </a>
                `;
            } else {
                html += `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">로그인</a>`;
            }
            userArea.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => { updateHeaderUI(); });
    </script>
</body>
</html>
