<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="/logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 알림 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; word-break: keep-all; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(226, 232, 240, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-blue-50 text-[#3182f6]">
                    <img src="/logo.png" alt="silverworks logo" class="w-8 h-8 object-contain">
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900">silverworks <span class="text-xs px-2 py-0.5 rounded-full bg-[#3182f6] text-white font-bold">1.0</span></span>
            </a>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-5 py-10 flex-1 w-full space-y-6">
        <div class="border-b border-slate-100 pb-5">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">알림 센터</h1>
            <p class="text-xs text-slate-500 mt-1">순위 지정, 승계 및 채용/포인트 지급 알림 내역</p>
        </div>

        <div id="notification-list" class="space-y-3"></div>
    </main>

    <script>
        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-[#3182f6] text-white hover:bg-[#1b64da] transition shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            await fetch(`/api/notifications/${user.id}/read`, { method: 'POST' });

            let html = `
                <a href="/notifications.html" class="relative p-2 text-[#3182f6] bg-blue-50 rounded-full transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-blue-50 text-[#3182f6] px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-blue-50 text-[#3182f6] flex items-center justify-center font-bold border border-blue-200 hover:border-[#3182f6] transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        async function loadNotifications() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            const notiContainer = document.getElementById('notification-list');

            if (!user) {
                notiContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">로그인이 필요합니다.</p>`;
                return;
            }

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const myNotis = notiRes.notifications || [];

            if (myNotis.length === 0) {
                notiContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-400 glass-card rounded-3xl">
                        <i class="fa-solid fa-bell-slash text-3xl mb-2 text-blue-300"></i>
                        <p class="text-xs font-bold">새로운 알림이 없습니다.</p>
                    </div>`;
            } else {
                notiContainer.innerHTML = myNotis.map(n => `
                    <div class="p-5 rounded-2xl bg-blue-50/50 border border-blue-100 flex justify-between items-start text-xs space-y-1">
                        <div>
                            <strong class="text-slate-900 font-bold block text-sm">${n.title}</strong>
                            <p class="text-slate-600 mt-1">${n.content}</p>
                            <span class="text-[10px] text-slate-400 block pt-1">${n.date}</span>
                        </div>
                        <button onclick="deleteNotification('${n.id}')" class="text-[10px] text-slate-400 hover:text-rose-500 font-bold px-2 py-0.5 rounded border border-slate-200 ml-3 shrink-0">
                            삭제
                        </button>
                    </div>
                `).join('');
            }
        }

        async function deleteNotification(id) {
            await fetch(`/api/notifications/item/${id}`, { method: 'DELETE' });
            loadNotifications();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            loadNotifications();
        });
    </script>
</body>
</html>
