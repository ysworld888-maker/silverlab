<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scalable=no">
    <title>SILVERWORKS - 실시간 알림 센터</title>
    <!-- [제1철칙 준수] 기존 고유 디자인 레이아웃 명세를 100% 원형 보존하며 가변 알림 스킨 구조만 추가 인서트 -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; letter-spacing: -0.4px; }
        body { background-color: #ffffff; color: #0f1419; padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background-color: #ffffff; border-bottom: 1px solid #eff3f4; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 800; color: #1967d2; cursor: pointer; }
        
        .noti-container { max-width: 600px; margin: 0 auto; padding: 32px 20px; }
        .page-headline { font-size: 22px; font-weight: 800; color: #1c1c1e; margin-bottom: 24px; border-left: 5px solid #1967d2; padding-left: 12px; }
        
        .btn-action-grey { font-size: 13.5px; font-weight: 700; color: #536471; background-color: #f7f9fa; border: 1px solid #eff3f4; padding: 8px 16px; border-radius: 9999px; cursor: pointer; transition: all 0.15s; }
        .btn-action-grey:hover { background-color: #eff3f4; color: #0f1419; }
        
        /* [지시 요건] 난잡함을 완벽히 배제하고 큼직하게 묶어 가시성을 끌어올린 입체 격자 카드 스타일 */
        .noti-item-box { background-color: #ffffff; border: 1px solid #eff3f4; border-radius: 20px; padding: 24px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.01); display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }
        .noti-item-box.unread-new-badge { border-left: 5px solid #1967d2; background-color: #fcfdfe; }
        
        .noti-timestamp-line { font-size: 11.5px; color: #8e8e93; font-weight: 600; }
        .noti-msg-body-text { font-size: 14px; color: #1c1c1e; font-weight: 600; line-height: 1.5; }
        
        .btn-back-square { width: 100%; background-color: #ffffff; color: #48484a; border: 1px solid #cfd9de; padding: 15px; border-radius: 12px; font-size: 14.5px; font-weight: 700; text-align: center; cursor: pointer; margin-top: 16px; transition: background-color 0.15s; }
        .btn-back-square:hover { background-color: #f7f9fa; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='/'">SILVERWORKS 알림방</div>
        <!-- [지시 요건 반영] 알림 기능은 회원만 이용할 수 있으므로 뒤로가기 기본 버튼 정렬 -->
        <button type="button" class="btn-action-grey" onclick="location.href='/'">광장으로 회군</button>
    </header>

    <div class="noti-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
            <h2 class="page-headline" style="margin-bottom:0;">내 통합 전산 알림함</h2>
            <!-- 일괄 읽음 처리 단추로 가시성 극대화 -->
            <button type="button" class="btn-action-grey" style="font-size:12px; padding:6px 12px;" onclick="executeMarkAllNotificationsAsReadEngine()">모두 읽음 처리</button>
        </div>
        
        <!-- 실시간 백엔드 데이터베이스 원장 조회를 통해 알림 카드가 비동기 동적 표출될 마운트 정착 구역 -->
        <div id="notificationsMasterListWrapperSlot">
            <div style="text-align:center; padding:40px; color:#8e8e93; font-weight:600; font-size:14px;">
                알림 내역 수신 선로를 대조 판독 중입니다...
            </div>
        </div>

        <button type="button" class="btn-back-square" onclick="location.href='/'">➔ 메인 광장 대문으로 나가기</button>
    </div>
    <!-- [백엔드 알림 원장 실시간 마운트 자바스크립트 엔진] -->
    <script>
        const myActiveUserId = localStorage.getItem('sw_username');
        const myActiveUserRole = localStorage.getItem('sw_role');

        document.addEventListener("DOMContentLoaded", function() {
            // [지시 요건] 알림 기능은 회원만 이용할 수 있도록 비회원 원천 차단 가드 락 가동
            if(!myActiveUserId) {
                alert('보안 가드 고지: 알림함 센터는 회원 전용 관제실입니다. 메인 대문으로 리다이렉트합니다.');
                location.href = '/';
                return;
            }
            loadMyLiveNotificationsFeedMasterList();
        });

        // 내 계정 앞으로 적재 수신된 알림 원장 목록을 실시간 동환 로드하는 파싱 엔진
        function loadMyLiveNotificationsFeedMasterList() {
            fetch('/api/notifications/list?username=' + encodeURIComponent(myActiveUserId))
                .then(res => res.json())
                .then(data => {
                    const wrapper = document.getElementById('notificationsMasterListWrapperSlot');
                    if(!data.success || !data.notifications || data.notifications.length === 0) {
                        wrapper.innerHTML = `<div style="text-align:center; padding:40px; color:#8e8e93; font-weight:600;">수신 적재된 전산망 실시간 알림 메시지가 존재하지 않습니다.</div>`;
                        return;
                    }

                    let htmlAccumulator = "";
                    // 최신 알림 메시지가 상단으로 오도록 역순 정렬 가동
                    const sortedNotis = [...data.notifications].sort((a, b) => b.id - a.id);

                    sortedNotis.forEach(n => {
                        const isUnread = parseInt(n.is_read) === 0;
                        let boxClass = "noti-item-box";
                        if (isUnread) {
                            boxClass += " unread-new-badge"; // 읽지 않은 신규 알림에 파란색 안심 하이라이트 락 부착
                        }

                        // 날짜 시각 포맷 정형화 변환
                        const dateFormatted = new Date(n.created_at).toLocaleString('ko-KR');

                        htmlAccumulator += `
                            <div class="${boxClass}">
                                <div class="noti-timestamp-line">수신 시각: ${dateFormatted}</div>
                                <div class="noti-msg-body-text">${n.message}</div>
                            </div>
                        `;
                    });

                    wrapper.innerHTML = htmlAccumulator;
                });
        }
        // [지시 요건 반영] 알림함 내부 메시지 내역을 일괄 무결성 읽음 상태로 초기화 세척 처리하는 트랜잭션 함수
        function executeMarkAllNotificationsAsReadEngine() {
            fetch('/api/notifications/read-all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: myActiveUserId })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadMyLiveNotificationsFeedMasterList(); // 실시간 가변 스위칭 리프레시 새로고침
                }
            });
        }
    </script>
</body>
</html>
