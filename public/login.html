<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 로그인 및 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; word-break: keep-all; }
        .btn-toss { background-color: #3182f6; color: #ffffff; transition: all 0.2s; }
        .btn-toss:hover { background-color: #1b64da; }
        .input-sky { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .input-sky:focus { border-color: #3182f6; outline: none; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(226, 232, 240, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200/60">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2">
                <div class="p-1 rounded-xl bg-blue-50 text-[#3182f6]">
                    <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-lg font-extrabold text-slate-900">silverworks</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-5">
        <div class="w-full max-w-md glass-card rounded-3xl p-8 space-y-6 text-center">
            <div class="inline-flex p-2.5 rounded-2xl bg-blue-50 text-[#3182f6] mb-1">
                <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                    <path d="M 48 70 C 62 82 78 78 86 60" />
                </svg>
            </div>

            <div class="bg-blue-50/70 p-1.5 rounded-full flex text-xs font-bold border border-blue-100">
                <button type="button" onclick="switchTab('senior')" id="tab-btn-senior" class="flex-1 py-2.5 rounded-full bg-[#3182f6] text-white shadow-sm transition">
                    시니어 회원
                </button>
                <button type="button" onclick="switchTab('employer')" id="tab-btn-employer" class="flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition">
                    사장님 회원
                </button>
            </div>

            <h2 id="form-title" class="text-xl font-bold text-slate-900 pt-1">시니어 회원 로그인</h2>

            <form onsubmit="handleSubmit(event)" class="space-y-4 text-xs text-left">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">아이디 (ID)</label>
                    <input type="text" id="user-id" placeholder="아이디 입력" required class="w-full p-3.5 rounded-xl input-sky font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">비밀번호 (Password)</label>
                    <input type="password" id="user-pw" placeholder="비밀번호 입력" required class="w-full p-3.5 rounded-xl input-sky font-medium">
                </div>
                <div id="extra-field" class="hidden space-y-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">성함 / 대표자명</label>
                        <input type="text" id="user-name" placeholder="성함 입력" class="w-full p-3.5 rounded-xl input-sky font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">연락처</label>
                        <input type="tel" id="user-phone" placeholder="010-0000-0000" class="w-full p-3.5 rounded-xl input-sky font-medium">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 btn-toss font-bold text-sm rounded-xl shadow-md mt-2">
                    보안 인증 로그인
                </button>
            </form>

            <div class="pt-2 text-xs text-slate-500">
                <span id="toggle-desc">아직 회원이 아니십니까?</span>
                <button onclick="toggleMode()" id="toggle-link" class="text-[#3182f6] font-bold hover:underline ml-1">회원가입 신청 →</button>
            </div>
        </div>
    </main>

    <script>
        let currentRole = 'senior';
        let isSignUpMode = false;

        function switchTab(role) {
            currentRole = role;
            const btnSenior = document.getElementById('tab-btn-senior');
            const btnEmployer = document.getElementById('tab-btn-employer');

            if (role === 'senior') {
                btnSenior.className = "flex-1 py-2.5 rounded-full bg-[#3182f6] text-white shadow-sm transition";
                btnEmployer.className = "flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition";
            } else {
                btnEmployer.className = "flex-1 py-2.5 rounded-full bg-[#3182f6] text-white shadow-sm transition";
                btnSenior.className = "flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition";
            }
            updateFormState();
        }

        function toggleMode() {
            isSignUpMode = !isSignUpMode;
            updateFormState();
        }

        function updateFormState() {
            const title = document.getElementById('form-title');
            const extra = document.getElementById('extra-field');
            const submitBtn = document.getElementById('submit-btn');
            const toggleDesc = document.getElementById('toggle-desc');
            const toggleLink = document.getElementById('toggle-link');

            const roleName = currentRole === 'senior' ? '시니어' : '사장님';

            if (isSignUpMode) {
                title.innerText = `${roleName} 회원가입 신청`;
                extra.classList.remove('hidden');
                submitBtn.innerText = "회원가입 신청서 제출";
                toggleDesc.innerText = "이미 계정이 있으십니까?";
                toggleLink.innerText = "로그인 화면 전환 →";
            } else {
                title.innerText = `${roleName} 회원 로그인`;
                extra.classList.add('hidden');
                submitBtn.innerText = "보안 인증 로그인";
                toggleDesc.innerText = "아직 회원이 아니십니까?";
                toggleLink.innerText = "회원가입 신청 →";
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const pw = document.getElementById('user-pw').value;

            if (isSignUpMode) {
                const name = document.getElementById('user-name').value || '회원';
                const phone = document.getElementById('user-phone').value || '';
                
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, pw, name, phone, role: currentRole })
                }).then(r => r.json());

                if (res.success) {
                    alert('회원가입 신청이 접수되었습니다. 관리자 승인 완료 후 어느 기기에서나 로그인할 수 있습니다.');
                    toggleMode();
                } else {
                    alert(res.message);
                }
            } else {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, pw, role: currentRole })
                }).then(r => r.json());

                if (res.success) {
                    localStorage.setItem('sw_user', JSON.stringify(res.user));
                    alert(`${res.user.name}님, 로그인되었습니다.`);

                    if (currentRole === 'senior') {
                        if (!res.user.hasSurvey) {
                            window.location.href = '/senior-apply.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    } else {
                        window.location.href = '/employer.html';
                    }
                } else {
                    alert(res.message);
                }
            }
        }
    </script>
</body>
</html>
