<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 로그인 및 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f0f9ff; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
        .input-sky { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .input-sky:focus { border-color: #38bdf8; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="bg-white/80 backdrop-blur-md border-b border-sky-100">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2">
                <div class="p-1 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-lg font-extrabold text-slate-800">silverworks</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-5">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-sky-100 shadow-xl space-y-6 text-center">
            <div class="inline-flex p-2.5 rounded-2xl bg-sky-50 text-sky-600 mb-1">
                <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                    <path d="M 48 70 C 62 82 78 78 86 60" />
                </svg>
            </div>

            <!-- Segmented Role Switcher -->
            <div class="bg-sky-50 p-1.5 rounded-full flex text-xs font-bold border border-sky-100">
                <button type="button" onclick="switchTab('senior')" id="tab-btn-senior" class="flex-1 py-2.5 rounded-full bg-sky-500 text-white shadow-sm transition">
                    시니어 회원
                </button>
                <button type="button" onclick="switchTab('employer')" id="tab-btn-employer" class="flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition">
                    사장님 회원
                </button>
            </div>

            <h2 id="form-title" class="text-xl font-bold text-slate-800 pt-1">시니어 회원 로그인</h2>

            <form onsubmit="handleSubmit(event)" class="space-y-4 text-xs text-left">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">아이디 (ID)</label>
                    <input type="text" id="user-id" placeholder="아이디 입력" required class="w-full p-3.5 rounded-xl input-sky">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">비밀번호 (Password)</label>
                    <input type="password" id="user-pw" placeholder="비밀번호 입력" required class="w-full p-3.5 rounded-xl input-sky">
                </div>
                <div id="extra-field" class="hidden space-y-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">성함 / 대표자명</label>
                        <input type="text" id="user-name" placeholder="성함 입력" class="w-full p-3.5 rounded-xl input-sky">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">연락처</label>
                        <input type="tel" id="user-phone" placeholder="010-0000-0000" class="w-full p-3.5 rounded-xl input-sky">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 btn-sky font-bold text-sm rounded-xl shadow-md mt-2">
                    보안 인증 로그인
                </button>
            </form>

            <div class="pt-2 text-xs text-slate-500">
                <span id="toggle-desc">아직 회원이 아니십니까?</span>
                <button onclick="toggleMode()" id="toggle-link" class="text-sky-600 font-bold hover:underline ml-1">회원가입 신청 →</button>
            </div>
        </div>
    </main>

    <script>
        let currentRole = 'senior';
        let isSignUpMode = false;

        function switchTab(role) {
            currentRole = role;
            const btnSenior = document.getElementById('tab-btn-senior');
            const btnEmployer = document.getElementById('tab-btn-employer');

            if (role === 'senior') {
                btnSenior.className = "flex-1 py-2.5 rounded-full bg-sky-500 text-white shadow-sm transition";
                btnEmployer.className = "flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition";
            } else {
                btnEmployer.className = "flex-1 py-2.5 rounded-full bg-sky-500 text-white shadow-sm transition";
                btnSenior.className = "flex-1 py-2.5 rounded-full text-slate-500 hover:text-slate-800 transition";
            }
            updateFormState();
        }

        function toggleMode() {
            isSignUpMode = !isSignUpMode;
            updateFormState();
        }

        function updateFormState() {
            const title = document.getElementById('form-title');
            const extra = document.getElementById('extra-field');
            const submitBtn = document.getElementById('submit-btn');
            const toggleDesc = document.getElementById('toggle-desc');
            const toggleLink = document.getElementById('toggle-link');

            const roleName = currentRole === 'senior' ? '시니어' : '사장님';

            if (isSignUpMode) {
                title.innerText = `${roleName} 회원가입 신청`;
                extra.classList.remove('hidden');
                submitBtn.innerText = "회원가입 신청서 제출";
                toggleDesc.innerText = "이미 계정이 있으십니까?";
                toggleLink.innerText = "로그인 화면 전환 →";
            } else {
                title.innerText = `${roleName} 회원 로그인`;
                extra.classList.add('hidden');
                submitBtn.innerText = "보안 인증 로그인";
                toggleDesc.innerText = "아직 회원이 아니십니까?";
                toggleLink.innerText = "회원가입 신청 →";
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const users = JSON.parse(localStorage.getItem('sw_users') || '[]');

            if (isSignUpMode) {
                const name = document.getElementById('user-name').value || '회원';
                const phone = document.getElementById('user-phone').value || '';
                
                users.push({ id, name, phone, role: currentRole, approved: false, points: 0 });
                localStorage.setItem('sw_users', JSON.stringify(users));

                alert('회원가입 신청이 접수되었습니다. 관리자 페이지에서 승인 처리 후 로그인 가능합니다.');
                toggleMode();
            } else {
                const target = users.find(u => u.id === id && u.role === currentRole);
                
                if (!target) {
                    alert('등록되지 않았거나 회원 유형이 일치하지 않습니다. 회원가입을 진행해 주세요.');
                    return;
                }
                if (!target.approved) {
                    alert('관리자 가입 승인 대기 중입니다. 관리자 승인 후 로그인할 수 있습니다.');
                    return;
                }

                localStorage.setItem('sw_user', JSON.stringify(target));
                alert(`${target.name}님, 로그인되었습니다.`);

                if (currentRole === 'senior') {
                    window.location.href = '/senior-apply.html';
                } else {
                    window.location.href = '/employer.html';
                }
            }
        }
    </script>
</body>
</html>
