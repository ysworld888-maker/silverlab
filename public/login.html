<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실버랩 - 통합 로그인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        .role-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 800;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2">
                <span class="text-2xl font-black text-blue-600 tracking-tight">SILVERLAB</span>
            </a>
            <a href="/index.html" class="text-xs font-bold text-slate-500 hover:text-slate-800">
                <i class="fa-solid fa-house mr-1"></i> 메인으로
            </a>
        </div>
    </header>

    <!-- Login Box -->
    <main class="max-w-md w-full mx-auto px-4 py-8 flex-1 flex flex-col justify-center">
        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-md border border-slate-200 space-y-6">

            <div class="text-center space-y-2">
                <h1 class="text-2xl font-black text-slate-900">실버랩 로그인</h1>
                <p class="text-xs text-slate-500">시니어 일자리 매칭 & 피크타임 인력 연결 플랫폼</p>
            </div>

            <!-- Role Selection Tabs -->
            <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button type="button" onclick="selectRole('seeker')" id="role-seeker" class="role-btn active py-2.5 rounded-lg text-slate-600 transition">
                    시니어 회원
                </button>
                <button type="button" onclick="selectRole('employer')" id="role-employer" class="role-btn py-2.5 rounded-lg text-slate-600 transition">
                    사장님 회원
                </button>
                <button type="button" onclick="selectRole('admin')" id="role-admin" class="role-btn py-2.5 rounded-lg text-slate-600 transition">
                    관리자
                </button>
            </div>

            <!-- Main Form -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1" id="idLabel">휴대폰 번호 또는 아이디</label>
                    <input type="text" id="loginId" placeholder="예: 01012345678" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-blue-600">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
                    <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-blue-600">
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-0">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="#" onclick="alert('고객센터(010-7464-3657)로 문의해 주세요.')" class="hover:underline">비밀번호 찾기</a>
                </div>

                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-base rounded-xl shadow transition mt-2">
                    로그인 하기
                </button>
            </form>

            <!-- Social / Easy Logins -->
            <div class="space-y-3 pt-2 border-t border-slate-100">
                <button type="button" onclick="easyLogin('kakao')" class="w-full py-3 bg-[#FEE500] hover:bg-[#FADA00] text-[#3c1e1e] font-bold text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-comment"></i> 카카오 3초 간편 로그인
                </button>
            </div>

            <!-- Prototype Quick Test Buttons -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                <p class="text-xs font-bold text-slate-500 text-center"><i class="fa-solid fa-flask text-blue-600"></i> 체험용 원클릭 빠른 로그인</p>
                <div class="grid grid-cols-3 gap-1.5 text-xs">
                    <button onclick="quickTestLogin('seeker')" class="bg-white border border-slate-300 hover:bg-blue-50 py-2 rounded-lg font-bold text-slate-700 transition">
                        시니어 회원
                    </button>
                    <button onclick="quickTestLogin('employer')" class="bg-white border border-slate-300 hover:bg-blue-50 py-2 rounded-lg font-bold text-slate-700 transition">
                        사장님 회원
                    </button>
                    <button onclick="quickTestLogin('admin')" class="bg-white border border-slate-300 hover:bg-blue-50 py-2 rounded-lg font-bold text-slate-700 transition">
                        관리자
                    </button>
                </div>
            </div>

            <!-- Sign up link -->
            <div class="text-center text-xs text-slate-500 pt-2">
                아직 실버랩 회원이 아니신가요? 
                <a href="/seeker.html" class="text-blue-600 font-bold hover:underline">회원가입 신청</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 text-center">
        <p><strong class="text-white">silverworks (실버웍스)</strong> | 대표: 유연성, 민 혁</p>
        <p class="text-slate-500 text-[11px] mt-1">경기도 성남시 중원구 광명로 79, 4층 404호</p>
    </footer>

    <script>
        let currentRole = 'seeker';

        function selectRole(role) {
            currentRole = role;
            ['seeker', 'employer', 'admin'].forEach(r => {
                document.getElementById('role-' + r).classList.remove('active');
            });
            document.getElementById('role-' + role).classList.add('active');

            const idLabel = document.getElementById('idLabel');
            if (role === 'seeker') idLabel.innerText = '휴대폰 번호 (시니어 회원)';
            else if (role === 'employer') idLabel.innerText = '아이디 또는 사업자번호 (사장님 회원)';
            else idLabel.innerText = '관리자 계정 ID';
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value;
            localStorage.setItem('userRole', currentRole);
            localStorage.setItem('userId', id);

            alert(`[로그인 성공]\n역할: ${currentRole.toUpperCase()}\n로그인 아이디: ${id}`);
            
            if(currentRole === 'admin') window.location.href = '/admin.html';
            else if(currentRole === 'employer') window.location.href = '/employer.html';
            else window.location.href = '/seeker.html';
        }

        function easyLogin(provider) {
            alert(`[${provider.toUpperCase()} 간편 로그인]\n인증 후 이동합니다.`);
            localStorage.setItem('userRole', 'seeker');
            window.location.href = '/seeker.html';
        }

        function quickTestLogin(role) {
            selectRole(role);
            document.getElementById('loginId').value = role + '_test_user';
            document.getElementById('loginPw').value = '123456';
            
            localStorage.setItem('userRole', role);
            localStorage.setItem('userId', role + '_test_user');

            if(role === 'admin') window.location.href = '/admin.html';
            else if(role === 'employer') window.location.href = '/employer.html';
            else window.location.href = '/seeker.html';
        }
    </script>
</body>
</html>
