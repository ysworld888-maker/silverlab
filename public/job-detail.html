<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 공고 상세 및 지원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="/jobs.html" class="text-sky-600 font-extrabold transition">피크타임 공고</a>
                <a href="/senior-apply.html" class="hover:text-sky-600 transition">시니어 일자리센터</a>
            </nav>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <a href="/jobs.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-sky-600 transition">
            <i class="fa-solid fa-arrow-left"></i> 공고 목록으로 돌아가기
        </a>

        <div id="job-detail-card" class="bg-white rounded-3xl p-7 md:p-9 border border-sky-100 shadow-sm space-y-6"></div>
    </main>

    <script>
        let currentJob = null;

        function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('id');
            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
            currentJob = jobs.find(j => j.id === jobId);

            const container = document.getElementById('job-detail-card');

            if (!currentJob) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10">공고를 찾을 수 없습니다.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="flex justify-between items-center border-b border-sky-100 pb-4">
                    <span class="bg-sky-50 text-sky-600 text-xs font-bold px-3 py-1 rounded-lg">${currentJob.category}</span>
                    <span class="text-xs font-extrabold text-sky-600 bg-sky-100/60 px-3 py-1 rounded-full">${currentJob.status}</span>
                </div>
                <div class="space-y-2">
                    <span class="text-xs font-bold text-slate-400 block">${currentJob.storeName}</span>
                    <h1 class="text-2xl font-black text-slate-800">${currentJob.title}</h1>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <div class="p-4 rounded-2xl bg-sky-50/40 border border-sky-100">
                        <span class="text-[11px] text-slate-400 font-bold block">근무 일자</span>
                        <strong class="text-sm font-bold text-slate-800">${currentJob.date}</strong>
                    </div>
                    <div class="p-4 rounded-2xl bg-sky-50/40 border border-sky-100">
                        <span class="text-[11px] text-slate-400 font-bold block">근무 시간</span>
                        <strong class="text-sm font-bold text-slate-800">${currentJob.time}</strong>
                    </div>
                    <div class="p-4 rounded-2xl bg-sky-100/50 border border-sky-200">
                        <span class="text-[11px] text-sky-700 font-bold block">지급 일당</span>
                        <strong class="text-lg font-black text-sky-600">${parseInt(currentJob.pay).toLocaleString()}원</strong>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex justify-end">
                    <button onclick="applyJob()" class="btn-sky text-sm font-extrabold px-8 py-4 rounded-2xl shadow-md w-full sm:w-auto">
                        피크타임 일자리 구직 지원하기
                    </button>
                </div>
            `;
        }

        function applyJob() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            if (!user) {
                alert('로그인이 필요한 서비스입니다.');
                location.href = '/login.html';
                return;
            }
            if (user.role !== 'senior') {
                alert('시니어 구직자 회원만 지원할 수 있습니다.');
                return;
            }

            const jobs = JSON.parse(localStorage.getItem('sw_jobs') || '[]');
            const idx = jobs.findIndex(j => j.id === currentJob.id);
            
            if (idx !== -1) {
                if (!jobs[idx].candidates) jobs[idx].candidates = [];
                
                const already = jobs[idx].candidates.find(c => c.seniorId === user.id);
                if (already) {
                    alert('이미 지원하신 공고입니다.');
                    return;
                }

                jobs[idx].candidates.push({
                    seniorId: user.id,
                    name: user.name,
                    phone: user.phone || '010-0000-0000',
                    appliedAt: new Date().toLocaleString(),
                    status: '지원 완료 (사장님 검토 중)'
                });

                localStorage.setItem('sw_jobs', JSON.stringify(jobs));
                alert('지원이 완료되었습니다! 지원 현황 및 채용 상태는 내 프로필 페이지에서 확인하실 수 있습니다.');
                location.href = '/profile.html';
            }
        }

        function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);

            let html = `
                <a href="/notifications.html" class="p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (user) {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${points.toLocaleString()}P (정산)
                    </a>
                    <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                        <i class="fa-solid fa-user"></i>
                    </a>
                    <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
                `;
            } else {
                html += `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
            }
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            loadJobDetail();
        });
    </script>
</body>
</html>
