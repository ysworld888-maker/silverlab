<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="/logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 공고 상세 및 구직 지원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; word-break: keep-all; }
        .btn-toss { background-color: #3182f6; color: #ffffff; transition: all 0.2s; }
        .btn-toss:hover { background-color: #1b64da; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(226, 232, 240, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-blue-50 text-[#3182f6]">
                    <img src="/logo.png" alt="silverworks logo" class="w-8 h-8 object-contain">
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900">silverworks <span class="text-xs px-2 py-0.5 rounded-full bg-[#3182f6] text-white font-bold">1.0</span></span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="/jobs.html" class="text-[#3182f6] font-extrabold transition">피크타임 공고</a>
                <a href="/senior-apply.html" class="hover:text-[#3182f6] transition">시니어 일자리센터</a>
            </nav>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <a href="/jobs.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-[#3182f6] transition">
            <i class="fa-solid fa-arrow-left"></i> 공고 목록으로 돌아가기
        </a>

        <div id="job-detail-card" class="glass-card rounded-3xl p-7 md:p-9 space-y-6"></div>
    </main>

    <script>
        let currentJob = null;

        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('id');
            const jobsRes = await fetch('/api/jobs').then(r => r.json());
            currentJob = (jobsRes.jobs || []).find(j => j.id === jobId);

            const container = document.getElementById('job-detail-card');

            if (!currentJob) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10">공고를 찾을 수 없습니다.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                    <span class="bg-blue-50 text-[#3182f6] text-xs font-bold px-3 py-1 rounded-lg border border-blue-100">${currentJob.category}</span>
                    <span class="text-xs font-extrabold text-[#3182f6] bg-blue-50 px-3 py-1 rounded-full border border-blue-100">${currentJob.status}</span>
                </div>
                <div class="space-y-2">
                    <span class="text-xs font-bold text-slate-400 block">${currentJob.storeName}</span>
                    <h1 class="text-2xl font-black text-slate-900">${currentJob.title}</h1>
                    ${currentJob.address ? `<p class="text-xs font-medium text-slate-600 flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-[#3182f6]"></i> 주소: ${currentJob.address}</p>` : ''}
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <div class="p-4 rounded-2xl bg-blue-50/40 border border-blue-100/60">
                        <span class="text-[11px] text-slate-400 font-bold block">근무 일자</span>
                        <strong class="text-sm font-bold text-slate-800">${currentJob.date}</strong>
                    </div>
                    <div class="p-4 rounded-2xl bg-blue-50/40 border border-blue-100/60">
                        <span class="text-[11px] text-slate-400 font-bold block">근무 시간</span>
                        <strong class="text-sm font-bold text-slate-800">${currentJob.time}</strong>
                    </div>
                    <div class="p-4 rounded-2xl bg-blue-50/80 border border-blue-200">
                        <span class="text-[11px] text-[#3182f6] font-bold block">지급 일당</span>
                        <strong class="text-lg font-black text-[#3182f6]">${parseInt(currentJob.pay).toLocaleString()}원</strong>
                    </div>
                </div>

                ${currentJob.description ? `
                <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2">
                    <h3 class="text-xs font-bold text-slate-700 flex items-center gap-1.5"><i class="fa-solid fa-clipboard-list text-[#3182f6]"></i> 상세 업무 및 요청 사항</h3>
                    <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${currentJob.description}</p>
                </div>
                ` : ''}

                <div class="pt-6 border-t border-slate-100 flex justify-end">
                    <button onclick="applyJob()" class="btn-toss text-sm font-extrabold px-8 py-4 rounded-2xl shadow-md w-full sm:w-auto">
                        피크타임 일자리 구직 지원하기
                    </button>
                </div>
            `;
        }

        async function applyJob() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            if (!user) {
                alert('로그인이 필요한 서비스입니다.');
                location.href = '/login.html';
                return;
            }
            if (user.role !== 'senior') {
                alert('시니어 구직자 회원만 지원할 수 있습니다.');
                return;
            }

            const res = await fetch(`/api/jobs/${currentJob.id}/apply`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seniorId: user.id,
                    name: user.name,
                    phone: user.phone || '010-0000-0000'
                })
            }).then(r => r.json());

            if (res.success) {
                alert('지원이 완료되었습니다! 지원 현황 및 채용 상태는 내 프로필 페이지에서 확인하실 수 있습니다.');
                location.href = '/profile.html';
            } else {
                alert(res.message);
            }
        }

        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl btn-toss shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const hasUnread = notiRes.hasUnread;

            let html = `
                <a href="/notifications.html" class="relative p-2 text-slate-500 hover:text-[#3182f6] transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    ${hasUnread ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-[#3182f6] rounded-full ring-2 ring-white"></span>` : ''}
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-blue-50 text-[#3182f6] px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-blue-50 text-[#3182f6] flex items-center justify-center font-bold border border-blue-200 hover:border-[#3182f6] transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            loadJobDetail();
        });
    </script>
</body>
</html>
