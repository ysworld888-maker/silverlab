<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 공고 상세 및 지원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0284c7; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0369a1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="/jobs.html" class="text-sky-600 font-extrabold transition">피크타임 공고</a>
                <a href="/senior-apply.html" class="hover:text-sky-600 transition">시니어 일자리센터</a>
                <a href="/employer.html" class="hover:text-sky-600 transition">사장님 센터</a>
            </nav>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <a href="/jobs.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-sky-600 transition">
            <i class="fa-solid fa-arrow-left"></i> 공고 목록으로 돌아가기
        </a>

        <div class="bg-white rounded-3xl p-6 md:p-8 border border-sky-100 shadow-sm space-y-6">
            <div id="job-detail-card" class="space-y-3"></div>
        </div>
    </main>

    <script>
        function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            const points = parseInt(localStorage.getItem('sw_points') || '0', 10);

            let html = `
                <a href="/notifications.html" class="p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            `;

            if (user) {
                const profileLink = user.role === 'senior' ? '/senior-apply.html' : '/employer.html';
                html += `
                    <button onclick="alert('사장님 센터 또는 마이페이지에서 정산 신청이 가능합니다.')" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${points.toLocaleString()}P (정산)
                    </button>
                    <a href="${profileLink}" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                        <i class="fa-solid fa-user"></i>
                    </a>
                    <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">
                        로그아웃
                    </button>
                `;
            } else {
                html += `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
            }
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        document.addEventListener('DOMContentLoaded', () => { updateHeaderUI(); });
    </script>
</body>
</html>
