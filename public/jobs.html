        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0ea5e9; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0284c7; }
        .input-sky { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .input-sky:focus { border-color: #38bdf8; outline: none; }

        /* 대한민국 17개 행정구역 5x5 격자 지도 모티브 */
        .korea-grid-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            grid-template-areas:
                ".       incheon seoul   gyeonggi gangwon"
                "chungnam sejong  daejeon chungbuk gyeongbuk"
                "jeonbuk  gwangju jeonnam daegu    ulsan"
                ".       .       .       gyeongnam busan"
                "jeju    .       .       .        .";
        }

        .area-seoul     { grid-area: seoul; }
        .area-incheon   { grid-area: incheon; }
        .area-gyeonggi  { grid-area: gyeonggi; }
        .area-gangwon   { grid-area: gangwon; }
        .area-chungnam  { grid-area: chungnam; }
        .area-sejong    { grid-area: sejong; }
        .area-daejeon   { grid-area: daejeon; }
        .area-chungbuk  { grid-area: chungbuk; }
        .area-gyeongbuk { grid-area: gyeongbuk; }
        .area-jeonbuk   { grid-area: jeonbuk; }
        .area-gwangju   { grid-area: gwangju; }
        .area-jeonnam   { grid-area: jeonnam; }
        .area-daegu     { grid-area: daegu; }
        .area-ulsan     { grid-area: ulsan; }
        .area-gyeongnam { grid-area: gyeongnam; }
        .area-busan     { grid-area: busan; }
        .area-jeju      { grid-area: jeju; }

        .map-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }
        .map-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
        }
        .map-tile.active {
            background-color: #0ea5e9 !important;
            color: #ffffff !important;
            border-color: #0284c7 !important;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }
        .map-tile.active .badge {
            background-color: #ffffff !important;
            color: #0ea5e9 !important;
        }
    </style>

        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const hasUnread = notiRes.hasUnread;

            let html = `
                <a href="/notifications.html" class="relative p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    ${hasUnread ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-sky-500 rounded-full ring-2 ring-white"></span>` : ''}
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        // 지도 토글 처리
        function toggleMapModal() {
            const grid = document.getElementById('gridMapSection');
            const btnText = document.getElementById('mapToggleBtnText');
            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                btnText.innerText = "지도 닫기";
            } else {
                grid.classList.add('hidden');
                btnText.innerText = "지도형 보기";
            }
        }

        // 백엔드 서버(`/api/jobs`)에서 실제 공고 데이터 가져오기
        async function fetchJobsFromServer() {
            try {
                const res = await fetch('/api/jobs').then(r => r.json());
                if (res.success) {
                    allServerJobs = res.jobs || [];
                    updateMapBadges();
                    renderFilterButtons();
                    applyFiltersAndRender();
                }
            } catch (err) {
                console.error("공고 불러오기 오류:", err);
            }
        }

        // 지도 타일 배지 건수 동적 업데이트
        function updateMapBadges() {
            Object.keys(shortRegionMap).forEach(shortName => {
                const fullName = shortRegionMap[shortName];
                const count = allServerJobs.filter(j => 
                    (j.title && j.title.includes(shortName)) || 
                    (j.storeName && j.storeName.includes(shortName))
                ).length;
                const badgeEl = document.getElementById(`badge-${shortName}`);
                if (badgeEl) badgeEl.innerText = count;
            });
        }

        // 1단계 & 2단계 필터 버튼 렌더링
        function renderFilterButtons() {
            const mainContainer = document.getElementById('mainRegionContainer');
            mainContainer.innerHTML = '';

            Object.keys(regionsData).forEach(region => {
                const isSelected = currentMainRegion === region || shortRegionMap[currentMainRegion] === region;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                    isSelected 
                    ? 'bg-sky-500 text-white shadow-sm' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                btn.innerText = region;
                btn.onclick = () => selectMainRegion(region);
                mainContainer.appendChild(btn);
            });

            // 2단계 세부지역 렌더링
            const subWrapper = document.getElementById('subRegionWrapper');
            const subContainer = document.getElementById('subRegionContainer');
            const selectedLabel = document.getElementById('selectedMainRegionLabel');
            
            selectedLabel.innerText = currentMainRegion;
            subContainer.innerHTML = '';

            const subList = regionsData[currentMainRegion] || regionsData[shortRegionMap[currentMainRegion]] || [];

            if (subList.length === 0) {
                subWrapper.classList.add('hidden');
            } else {
                subWrapper.classList.remove('hidden');
                subList.forEach(sub => {
                    const isSubSelected = currentSubRegion === sub;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        isSubSelected 
                        ? 'bg-emerald-500 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`;
                    btn.innerText = sub;
                    btn.onclick = () => selectSubRegion(sub);
                    subContainer.appendChild(btn);
                });
            }

            // 5x5 지도 타일 액티브 스타일 동기화
            document.querySelectorAll('.map-tile').forEach(tile => {
                const r = tile.getAttribute('data-map-region');
                if (r === currentMainRegion || shortRegionMap[r] === currentMainRegion) {
                    tile.classList.add('active');
                } else {
                    tile.classList.remove('active');
                }
            });
        }

        function selectMainRegion(region) {
            currentMainRegion = shortRegionMap[region] || region;
            currentSubRegion = "전체";
            renderFilterButtons();
            applyFiltersAndRender();
        }

        function selectSubRegion(sub) {
            currentSubRegion = sub;
            renderFilterButtons();
            applyFiltersAndRender();
        }

        // 필터링 적용 및 화면 출력 (1번 사진의 '공고 없음' UI 및 카드 디자인 적용)
        function applyFiltersAndRender() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const feedCard = document.getElementById('jobsFeedCard');

            const filtered = allServerJobs.filter(job => {
                // 지역 필터 (제목 또는 매장명 기준)
                let matchesMain = true;
                if (currentMainRegion !== "전체보기") {
                    const cleanMain = currentMainRegion.replace(/(서울특별시|경기도|광역시|특별자치도)/g, '').trim();
                    matchesMain = (job.title && (job.title.includes(currentMainRegion) || job.title.includes(cleanMain))) ||
                                 (job.storeName && (job.storeName.includes(currentMainRegion) || job.storeName.includes(cleanMain)));
                }

                let matchesSub = true;
                if (currentSubRegion !== "전체") {
                    matchesSub = (job.title && job.title.includes(currentSubRegion)) ||
                                 (job.storeName && job.storeName.includes(currentSubRegion));
                }

                // 키워드 검색
                let matchesSearch = true;
                if (keyword) {
                    matchesSearch = (job.title && job.title.toLowerCase().includes(keyword)) ||
                                    (job.storeName && job.storeName.toLowerCase().includes(keyword)) ||
                                    (job.category && job.category.toLowerCase().includes(keyword));
                }

                return matchesMain && matchesSub && matchesSearch;
            });

            // 1번 사진 스타일: 공고 없을 때 표시되는 안심 안내 카드 UI
            if (filtered.length === 0) {
                const targetRegionText = currentSubRegion !== "전체" ? `${currentMainRegion} ${currentSubRegion}` : currentMainRegion;
                feedCard.innerHTML = `
                    <div class="bg-white rounded-3xl p-16 border border-sky-100 shadow-sm text-center flex flex-col items-center justify-center space-y-3">
                        <div class="w-14 h-14 rounded-full bg-sky-200/80 text-white flex items-center justify-center text-2xl font-black shadow-inner mb-1">
                            <i class="fa-solid fa-exclamation"></i>
                        </div>
                        <p class="text-slate-500 font-bold text-sm">
                            '${targetRegionText}' 지역에 등록된 구인 공고가 없습니다.
                        </p>
                    </div>
                `;
                return;
            }

            // 공고 카드 목록 출력
            feedCard.innerHTML = filtered.map(job => `
                <div class="bg-white rounded-3xl p-6 md:p-7 border border-sky-100 shadow-sm hover:border-sky-300 transition flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg border border-sky-100">${job.category || '기타'}</span>
                            ${job.isPeak ? '<span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200"><i class="fa-solid fa-thumbtack mr-1"></i>상단 고정</span>' : ''}
                            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-100">${job.status}</span>
                        </div>
                        <h3 class="text-lg font-black text-slate-800 hover:text-sky-600 transition cursor-pointer" onclick="location.href='/job-detail.html?id=${job.id}'">
                            ${job.title}
                        </h3>
                        <p class="text-xs text-slate-500 font-medium">
                            <strong class="text-slate-700">${job.storeName}</strong> | 근무일: ${job.date} (${job.time})
                        </p>
                    </div>
                    <div class="flex sm:flex-col items-end justify-between sm:justify-center gap-3 border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                        <span class="text-lg font-black text-sky-600">${parseInt(job.pay).toLocaleString()}원</span>
                        <a href="/job-detail.html?id=${job.id}" class="btn-sky text-xs font-bold px-5 py-2.5 rounded-xl shadow-sm whitespace-nowrap">
                            상세보기 / 지원
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // 검색창 실시간 반응
        document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);

        // 최초 페이지 초기화
        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            fetchJobsFromServer();
        });
    </script>
</body>
</html>
