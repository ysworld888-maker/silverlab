<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 맞춤 피크타임 일자리 찾기</title>
    
    <!-- 1. 브라우저 탭 파비콘 연결 -->
    <link rel="icon" href="/logo.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; word-break: keep-all; }
        .btn-toss { background-color: #3182f6; color: #ffffff; transition: all 0.2s; }
        .btn-toss:hover { background-color: #1b64da; }
        .input-sky { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .input-sky:focus { border-color: #3182f6; outline: none; }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(226, 232, 240, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(49, 130, 246, 0.35);
            box-shadow: 0 16px 36px -8px rgba(49, 130, 246, 0.16);
        }

        .korea-grid-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            grid-template-areas:
                ".       incheon seoul   gyeonggi gangwon"
                "chungnam sejong  daejeon chungbuk gyeongbuk"
                "jeonbuk  gwangju jeonnam daegu    ulsan"
                ".       .       .       gyeongnam busan"
                "jeju    .       .       .        .";
        }

        .area-seoul     { grid-area: seoul; }
        .area-incheon   { grid-area: incheon; }
        .area-gyeonggi  { grid-area: gyeonggi; }
        .area-gangwon   { grid-area: gangwon; }
        .area-chungnam  { grid-area: chungnam; }
        .area-sejong    { grid-area: sejong; }
        .area-daejeon   { grid-area: daejeon; }
        .area-chungbuk  { grid-area: chungbuk; }
        .area-gyeongbuk { grid-area: gyeongbuk; }
        .area-jeonbuk   { grid-area: jeonbuk; }
        .area-gwangju   { grid-area: gwangju; }
        .area-jeonnam   { grid-area: jeonnam; }
        .area-daegu     { grid-area: daegu; }
        .area-ulsan     { grid-area: ulsan; }
        .area-gyeongnam { grid-area: gyeongnam; }
        .area-busan     { grid-area: busan; }
        .area-jeju      { grid-area: jeju; }

        .sub-grid-map {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        .map-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }
        .map-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.18);
        }
        .map-tile.active {
            background-color: #3182f6 !important;
            color: #ffffff !important;
            border-color: #1b64da !important;
            box-shadow: 0 4px 14px rgba(49, 130, 246, 0.35);
        }
        .map-tile.active .tile-text { color: #ffffff !important; }
        .map-tile.active .badge {
            background-color: #ffffff !important;
            color: #3182f6 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

            <!-- 데스크탑 메뉴 -->

        </div>

            <a href="/jobs.html" class="block py-2.5 px-3 rounded-xl hover:bg-blue-50 hover:text-[#3182f6] transition flex items-center gap-2 text-[#3182f6]">
                <i class="fa-solid fa-briefcase"></i> 피크타임 공고 (구인구직)
            </a>
            <a href="/senior-apply.html" class="block py-2.5 px-3 rounded-xl hover:bg-blue-50 hover:text-[#3182f6] transition flex items-center gap-2">
                <i class="fa-solid fa-user-doctor"></i> 시니어 일자리센터
            </a>
            <a href="/employer.html" class="block py-2.5 px-3 rounded-xl hover:bg-blue-50 hover:text-[#3182f6] transition flex items-center gap-2">
                <i class="fa-solid fa-store"></i> 사장님 센터
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-5 py-8 flex-1 w-full space-y-6">

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6">
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">맞춤 피크타임 일자리 찾기</h1>
                    <p class="text-xs text-slate-500 mt-1 font-medium">원하는 대지역을 클릭한 후, 지도의 세부 동네를 눌러 초단기(2~3시간) 공고를 조회하세요.</p>
                </div>
                
                <div class="relative w-full sm:w-72">
                    <input type="text" id="searchInput" placeholder="공고 제목, 매장명 검색..." 
                           class="w-full pl-9 pr-4 py-2.5 rounded-xl input-sky text-xs font-medium focus:ring-2 focus:ring-[#3182f6]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div class="p-5 bg-blue-50/50 rounded-2xl border border-blue-100/70 space-y-3">
                <div class="flex justify-between items-center pb-1">
                    <div class="flex items-center gap-2">
                        <span id="mapTitleLabel" class="text-xs font-bold text-slate-800">
                            <i class="fa-solid fa-earth-asia text-[#3182f6] mr-1.5"></i>대한민국 17개 광역시·도 지도
                        </span>

                    <button id="backToNationalBtn" onclick="selectMainRegion('전체보기')" class="hidden px-2.5 py-1 bg-white hover:bg-blue-100 text-[#3182f6] text-[11px] font-bold rounded-lg border border-blue-200 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 전국 지도 보기
                    </button>
                </div>

                <div id="mapRenderContainer" class="max-w-2xl mx-auto">
                </div>
            </div>

        </div>

        <div id="jobsFeedCard" class="space-y-4"></div>

    </main>

            } else {
                menu.classList.add('hidden');
                icon.className = 'fa-solid fa-bars';
            }
        }

        };

        let allServerJobs = [];
        let currentMainRegion = "전체보기";
        let currentSubRegion = "전체";

        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-3.5 py-2 rounded-xl btn-toss shadow-sm">로그인/가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const hasUnread = notiRes.hasUnread;

            let html = `
                <a href="/notifications.html" class="relative p-1.5 text-slate-500 hover:text-[#3182f6] transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    ${hasUnread ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-[#3182f6] rounded-full ring-2 ring-white"></span>` : ''}
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-blue-50 text-[#3182f6] px-2.5 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition hidden sm:inline-block">
                        ${(freshUser.points || 0).toLocaleString()}P
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-8 h-8 rounded-full bg-blue-50 text-[#3182f6] flex items-center justify-center font-bold border border-blue-200 hover:border-[#3182f6] transition" title="프로필 페이지">
                    <i class="fa-solid fa-user text-xs"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-1.5 py-1 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        async function fetchJobsFromServer() {
            try {
                const res = await fetch('/api/jobs').then(r => r.json());
                if (res.success) {
                    allServerJobs = res.jobs || [];
                    renderMapGrid();
                    applyFiltersAndRender();
                }
            } catch (err) {
                console.error("공고 불러오기 오류:", err);
            }
        }

                titleLabel.innerHTML = `<i class="fa-solid fa-earth-asia text-[#3182f6] mr-1.5"></i>대한민국 17개 광역시·도 지도`;
                backBtn.classList.add('hidden');

                mapContainer.innerHTML = `

                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('세종특별자치시')}</span>
                        </button>
                        <button onclick="selectMainRegion('대전광역시')" class="map-tile area-daejeon bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">

                        </button>

                        <button onclick="selectMainRegion('전라북도')" class="map-tile area-jeonbuk bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">

                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('전라북도')}</span>
                        </button>
                        <button onclick="selectMainRegion('광주광역시')" class="map-tile area-gwangju bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">광주</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('광주광역시')}</span>
                        </button>
                        <button onclick="selectMainRegion('전라남도')" class="map-tile area-jeonnam bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">전남</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('전라남도')}</span>
                        </button>
                        <button onclick="selectMainRegion('대구광역시')" class="map-tile area-daegu bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">대구</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('대구광역시')}</span>
                        </button>
                        <button onclick="selectMainRegion('울산광역시')" class="map-tile area-ulsan bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">울산</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('울산광역시')}</span>
                        </button>

                        <button onclick="selectMainRegion('경상남도')" class="map-tile area-gyeongnam bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">경남</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('경상남도')}</span>
                        </button>
                        <button onclick="selectMainRegion('부산광역시')" class="map-tile area-busan bg-white border border-slate-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">부산</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('부산광역시')}</span>
                        </button>
                        <button onclick="selectMainRegion('제주특별자치도')" class="map-tile area-jeju bg-blue-50/80 border border-blue-200 p-2 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-[#3182f6] tile-text">제주</span>
                            <span class="badge text-[10px] bg-blue-200 text-[#1b64da] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs('제주특별자치도')}</span>
                        </button>
                    </div>
                `;
            } else {
                titleLabel.innerHTML = `<i class="fa-solid fa-location-dot text-[#3182f6] mr-1.5"></i><strong>${currentMainRegion}</strong> 세부 지형 지도`;
                backBtn.classList.remove('hidden');

                const subList = regionMapData[currentMainRegion] || ["전체"];
                
                let subButtonsHtml = `
                    <button onclick="selectSubRegion('전체')" class="map-tile ${currentSubRegion === '전체' ? 'active' : ''} bg-white border border-slate-200 p-2.5 rounded-xl flex flex-col items-center justify-center">
                        <span class="text-xs font-bold text-slate-800 tile-text">전체</span>
                        <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-2 py-0.5 rounded-full mt-1">${countJobs(currentMainRegion, '전체')}</span>
                    </button>
                `;

                subButtonsHtml += subList.map(sub => {
                    const isActive = currentSubRegion === sub;
                    return `
                        <button onclick="selectSubRegion('${sub}')" class="map-tile ${isActive ? 'active' : ''} bg-white border border-slate-200 p-2.5 rounded-xl flex flex-col items-center justify-center min-h-[56px]">
                            <span class="text-xs font-bold text-slate-800 tile-text">${sub}</span>
                            <span class="badge text-[10px] bg-blue-50 text-[#3182f6] font-extrabold px-1.5 py-0.5 rounded-full mt-1">${countJobs(currentMainRegion, sub)}</span>
                        </button>
                    `;
                }).join('');

                mapContainer.innerHTML = `<div class="sub-grid-map">${subButtonsHtml}</div>`;
            }
        }

        function countJobs(mainRegion, subRegion = "전체") {
            return allServerJobs.filter(j => {
                const mainMatch = (j.regionMain === mainRegion) || 
                                 (shortToFull[j.regionMain] === mainRegion) ||
                                 (j.title && j.title.includes(mainRegion.substring(0, 2))) ||
                                 (j.storeName && j.storeName.includes(mainRegion.substring(0, 2)));

                if (!mainMatch) return false;
                if (subRegion === "전체") return true;

                return (j.regionSub === subRegion) || 
                       (j.title && j.title.includes(subRegion)) || 
                       (j.storeName && j.storeName.includes(subRegion));
            }).length;
        }

        function selectMainRegion(region) {
            currentMainRegion = region;
            currentSubRegion = "전체";
            renderMapGrid();
            applyFiltersAndRender();
        }

        function selectSubRegion(sub) {
            currentSubRegion = sub;
            renderMapGrid();
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const feedCard = document.getElementById('jobsFeedCard');

            const filtered = allServerJobs.filter(job => {
                let matchesMain = true;
                if (currentMainRegion !== "전체보기") {
                    const mainShort = currentMainRegion.substring(0, 2);
                    matchesMain = (job.regionMain === currentMainRegion) || 
                                 (shortToFull[job.regionMain] === currentMainRegion) ||
                                 (job.title && job.title.includes(mainShort)) ||
                                 (job.storeName && job.storeName.includes(mainShort));
                }

                let matchesSub = true;
                if (currentSubRegion !== "전체") {
                    matchesSub = (job.regionSub === currentSubRegion) ||
                                 (job.title && job.title.includes(currentSubRegion)) ||
                                 (job.storeName && job.storeName.includes(currentSubRegion));
                }

                let matchesSearch = true;
                if (keyword) {
                    matchesSearch = (job.title && job.title.toLowerCase().includes(keyword)) ||
                                    (job.storeName && job.storeName.toLowerCase().includes(keyword)) ||
                                    (job.category && job.category.toLowerCase().includes(keyword)) ||
                                    (job.address && job.address.toLowerCase().includes(keyword));
                }

                return matchesMain && matchesSub && matchesSearch;
            });

            if (filtered.length === 0) {
                const targetText = currentSubRegion !== "전체" ? `${currentMainRegion} ${currentSubRegion}` : currentMainRegion;
                feedCard.innerHTML = `
                    <div class="glass-card rounded-3xl p-16 text-center flex flex-col items-center justify-center space-y-3">
                        <div class="w-14 h-14 rounded-full bg-blue-100 text-[#3182f6] flex items-center justify-center text-2xl font-black shadow-inner mb-1">
                            <i class="fa-solid fa-exclamation"></i>
                        </div>
                        <p class="text-slate-500 font-bold text-sm">
                            '${targetText}' 지역에 등록된 구인 공고가 없습니다.
                        </p>
                    </div>
                `;
                return;
            }

            feedCard.innerHTML = filtered.map(job => `
                <div class="glass-card rounded-3xl p-6 md:p-7 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-[#3182f6] bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100">${job.category || '식당·서빙'}</span>
                            <span class="text-xs font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg">${job.regionMain || '서울특별시'} ${job.regionSub || ''}</span>
                            ${job.isPeak ? '<span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200"><i class="fa-solid fa-thumbtack mr-1"></i>상단 고정</span>' : ''}
                            <span class="text-xs font-bold text-[#3182f6] bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100">${job.status}</span>
                        </div>
                        <h3 class="text-lg font-black text-slate-900 hover:text-[#3182f6] transition cursor-pointer" onclick="location.href='/job-detail.html?id=${job.id}'">
                            ${job.title}
                        </h3>
                        <p class="text-xs text-slate-500 font-medium">
                            <strong class="text-slate-800">${job.storeName}</strong> ${job.address ? `(${job.address})` : ''} | 근무일: ${job.date} (${job.time})
                        </p>
                    </div>
                    <div class="flex sm:flex-col items-end justify-between sm:justify-center gap-3 border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                        <span class="text-lg font-black text-[#3182f6]">${parseInt(job.pay).toLocaleString()}원</span>
                        <a href="/job-detail.html?id=${job.id}" class="btn-toss text-xs font-bold px-5 py-2.5 rounded-xl shadow-sm whitespace-nowrap">
                            상세보기 / 지원
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            fetchJobsFromServer();
        });
    </script>
</body>
</html>
