<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scalable=no">
    <title>SILVERWORKS - 구인구직 피드 관제 센터</title>
    <!-- [제1철칙 준수] 기존 고유 디자인 레이아웃 명세를 100% 원형 보존하며 마감 토글 배너 락 스타일만 추가 인서트 -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; letter-spacing: -0.4px; }
        body { background-color: #ffffff; color: #0f1419; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background-color: #ffffff; border-bottom: 1px solid #eff3f4; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 800; color: #1967d2; cursor: pointer; }
        
        .feed-container { max-width: 800px; margin: 0 auto; padding: 24px 20px; }
        .page-headline { font-size: 22px; font-weight: 800; color: #1c1c1e; margin-bottom: 20px; border-left: 5px solid #1967d2; padding-left: 12px; }
        
        /* [지시 요건] 구독 결제 사장님의 광고성 공고 상단 고정 표식 및 오션블루 프리미엄 스킨 인프라 */
        .job-feed-card { background-color: #ffffff; border: 1px solid #eff3f4; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.01); position: relative; transition: border-color 0.2s; }
        .job-feed-card.premium-pinned-ad { border: 2px solid #1967d2; background-color: #f4f9ff; }
        
        /* 프리미엄 가맹 광고 배지 스킨 명세 */
        .premium-ad-badge-line { display: inline-block; background-color: #1967d2; color: #ffffff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; text-transform: uppercase; }
        
        /* [지시 요건] 채용 완료/마감 시 렌더링될 투명 가드 커버 레이어 레이아웃 */
        .job-feed-card.completed-lock-view { opacity: 0.65; background-color: #f8f9fa; border-color: #cfd9de; }
        .completed-soldout-banner-tag { display: inline-block; background-color: #536471; color: #ffffff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
        
        .job-title-row { font-size: 18px; font-weight: 800; color: #1c1c1e; margin-bottom: 8px; }
        .job-meta-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13.5px; color: #536471; font-weight: 600; margin-bottom: 16px; padding: 12px 0; border-top: 1px solid #f2f4f6; border-bottom: 1px solid #f2f4f6; }
        .job-meta-detail-grid div { display: flex; gap: 6px; }
        .job-meta-detail-grid strong { color: #1c1c1e; font-weight: 700; }
        
        .btn-feed-submit-action { background-color: #1967d2; color: #ffffff; border: none; padding: 12px 24px; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background-color 0.15s; width: fit-content; }
        .btn-feed-submit-action:hover { background-color: #1152b3; }
        .btn-feed-submit-action:disabled { background-color: #cfd9de; color: #8e8e93; cursor: not-allowed; }
        
        .btn-purge-delete-red { background-color: #ffffff; color: #eb5757; border: 1px solid #fcf0f0; padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background-color 0.15s; }
        .btn-purge-delete-red:hover { background-color: #fff1f1; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='/'">SILVERWORKS 구인피드</div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button type="button" class="btn-feed-submit-action" style="padding:6px 14px; font-size:12.5px; background-color:#ffffff; color:#1967d2; border:1px solid #1967d2;" onclick="location.href='/'">메인 대문 복귀</button>
            <span id="uFeedStatusName" style="font-size:13px; font-weight:700; color:#1c1c1e;">로그인 확인 중...</span>
        </div>
    </header>

    <div class="feed-container">
        <!-- [디자인 단순화] 큼직하게 묶어 가시성을 끌어올린 실시간 구인 원장록 헤드라인 -->
        <h2 class="page-headline">실시간 게재 구인 공고 피드 원장록</h2>
        
        <!-- 실시간 백엔드 데이터베이스 원장 조회를 통해 공고 카드가 비동기 동적 표출될 마운트 정착 구역 -->
        <div id="jobsFeedMasterGridWrapperSlot">
            <div style="text-align:center; padding:40px; color:#8e8e93; font-weight:600; font-size:14px;">
                실버웍스 공인 구인 전산망 통신 회로를 연결하는 중입니다...
            </div>
        </div>
    </div>
    <!-- [백엔드 구인 피드 실시간 연동 및 상단 고정 광고 마케팅 자바스크립트 엔진] -->
    <script>
        const myActiveUserId = localStorage.getItem('sw_username');
        const myActiveUserRole = localStorage.getItem('sw_role');
        const myActiveUserName = localStorage.getItem('sw_name');

        document.addEventListener("DOMContentLoaded", function() {
            handleCheckUserFeedAuthDisplay();
            loadLiveJobsFeedMasterGrid();
        });

        // 현재 로그인한 베테랑 및 사장님의 계명 이름을 헤더 우측에 안전 실시간 표출하는 유닛
        function handleCheckUserFeedAuthDisplay() {
            const statusName = document.getElementById('uFeedStatusName');
            if(myActiveUserId && myActiveUserName) {
                statusName.innerText = `${myActiveUserName}님 관제중`;
            } else {
                statusName.innerText = "비회원 단순조회 모드";
            }
        }

        // 백엔드 원장 데이터베이스를 실시간 파싱 로드하여 피드판을 정렬 렌더링하는 핵심 엔진
        function loadLiveJobsFeedMasterGrid() {
            fetch('/api/jobs/list-all')
                .then(res => res.json())
                .then(data => {
                    const wrapper = document.getElementById('jobsFeedMasterGridWrapperSlot');
                    if(!data.success || !data.jobs || data.jobs.length === 0) {
                        wrapper.innerHTML = `<div style="text-align:center; padding:40px; color:#8e8e93; font-weight:600;">현재 게재 승인된 피크타임 구인공고문이 존재하지 않습니다.</div>`;
                        return;
                    }

                    // [지시 요건 완벽 수립] 연 4만원 구독 사장님의 공고글을 최상단 고정 정렬 배정 배치
                    const sortedJobs = [...data.jobs].sort((a, b) => (b.is_pinned || 0) - (a.is_pinned || 0) || b.id - a.id);
                    
                    let htmlAccumulator = "";
                    sortedJobs.forEach(j => {
                        const isPinned = parseInt(j.is_pinned) === 1;
                        const isCompleted = j.status === 'completed'; // 채용 완료 마감 판단 분기

                        // 프리미엄 구독 광고 배지 및 마감 락 클래스 동적 주입 연산
                        let cardClass = "job-feed-card";
                        let premiumBadge = "";
                        let completedBadge = "";
                        let disabledAttr = "";
                        let btnText = "베테랑 구직 지원하기";

                        if (isPinned) {
                            cardClass += " premium-pinned-ad";
                            premiumBadge = `<span class="premium-ad-badge-line">👑 프리미엄 구독 광고 회원</span>`;
                        }

                        if (isCompleted) {
                            cardClass += " completed-lock-view";
                            completedBadge = `<span class="completed-soldout-banner-tag">✓ 채용 완료 / 마감</span>`;
                            disabledAttr = "disabled";
                            btnText = "지원 마감된 공고";
                        }

                        // 최고 관리자실 및 작성자 사장님 본인만 가동할 수 있는 정화 강제 파쇄 삭제 단추 레이어 연동
                        let purgeDeleteBtn = "";
                        if(myActiveUserId === 'admin' || myActiveUserId === j.employer_id) {
                            purgeDeleteBtn = `<button type="button" class="btn-purge-delete-red" onclick="executePurgeDeleteJobFeedV2(${j.id})">공고 파쇄 삭제</button>`;
                        }

                        htmlAccumulator += `
                            <div class="${cardClass}">
                                ${premiumBadge}
                                ${completedBadge}
                                <div class="job-title-row">${j.title}</div>
                                <div style="font-size:14px; font-weight:700; color:#1967d2; margin-bottom:12px;">${j.company}</div>
                                
                                <!-- 사장님이 명세 제안하신 구인공고글 6대 필수 기입 항목 정형화 디스플레이 그리드 -->
                                <div class="job-meta-detail-grid">
                                    <div>근무지 위치: <strong>${j.job_location || '-'}</strong></div>
                                    <div>근무 날짜: <strong>${j.work_date || '-'}</strong></div>
                                    <div>피크 타임: <strong>${j.work_time || '-'}</strong></div>
                                    <div>모집 인원: <strong>${j.slots_limit || '1'}명</strong></div>
                                    <div>약정 급여: <strong style="color:#1967d2;">${parseInt(j.wage).toLocaleString()}원</strong></div>
                                    <div>담당 업무: <strong>${j.job_duty || '-'}</strong></div>
                                </div>
                                
                                <div style="display:flex; justify-content:between; align-items:center; width:100%; gap:12px;">
                                    <button type="button" class="btn-feed-submit-action" ${disabledAttr} onclick="executeApplyJobTransactionEngine(${j.id}, '${j.employer_id}')">${btnText}</button>
                                    <div style="margin-left:auto;">${purgeDeleteBtn}</div>
                                </div>
                            </div>
                        `;
                    });

                    wrapper.innerHTML = htmlAccumulator;
                });
        }
        // 시니어 회원이 [지원하기] 단추를 터치 시 안전하게 권한을 가드 판독하는 트랜잭션 구동 엔진
        function executeApplyJobTransactionEngine(jobId, employerId) {
            // 1. 비회원 단순조회 상태일 때 터치 차단 가드 락
            if(!myActiveUserId || !myActiveUserRole) {
                alert('보안 가드 고지: 구직 지원은 회원전용 기능입니다. 통합 인증 센터에서 로그인을 선행 완료해 주십시오.');
                location.href = '/login.html';
                return;
            }
            // 2. 구인 사장님 계정 상태로 지원하기 터치 시 상호 교차 차단 락 가동
            if(myActiveUserRole === 'employer') {
                alert('보안 권한 제한: 구인 사장님 회원은 시니어 피드 공고에 지원할 수 없습니다.');
                return;
            }

            // 3. 블랙리스트 차단 계정 및 오프라인 체력 미검증 가입 대기 유저 전수 검증 포트 가동
            fetch('/api/profile/me?username=' + encodeURIComponent(myActiveUserId))
                .then(res => res.json())
                .then(data => {
                    if(data.success && data.profile) {
                        const p = data.profile;
                        
                        // 약속 위반 불량 고지 차단
                        if(parseInt(p.is_blacklist) === 1) {
                            alert('보안 행정 처분 고지: 귀하는 약속 위반 노쇼 결함 누적으로 인해 지원 권한이 전격 임시 동결 격리 조치된 계정입니다. 본사로 문의하세요.');
                            return;
                        }
                        // 2차 오프라인 체력 테스트 수기 주입 미인증 회원 지원 원천 차단 가드 락
                        if(!p.fitness_grade || p.fitness_grade === '미인증') {
                            alert('보안 검증 알림: 아직 2차 오프라인 검증이 완료되지 않은 가입 대기 상태입니다. 실버웍스 사무실에 방문하셔서 국민체력 100 기준 테스트를 통과하셔야 정식 구직 지원권이 개통됩니다.');
                            return;
                        }

                        if(!confirm('피크타임 구직 청약 고지:\n\n선택하신 숙련 직무 매장 공고에 정식 구직 원장을 송출합니까?\n\n(확정 시 사장님 고용 콘솔로 체력 스펙 프로필 명세 사본이 실시간 인서트 수납됩니다)')) return;

                        // 최종 트랜잭션 결속 바인딩 포트 송출
                        fetch('/api/jobs/apply', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ job_id: parseInt(jobId), seeker_id: myActiveUserId })
                        }).then(res => res.json()).then(resData => {
                            if(resData.success) {
                                alert('구직 청약 지원 최종 대성공!\n\n가맹 사장님이 1·2·3순위 지망 배정을 확정 짓는 즉시 내 알림방으로 안심 근무 확인서가 자동 연동 수신 적재됩니다.');
                                location.reload();
                            } else {
                                alert('지원 실패 안내: ' + resData.message);
                            }
                        });
                    }
                });
        }

        // 사장님 자율 삭제 및 최고 관리자 본부의 허위 공고문 실시간 강제 파쇄 삭제 트랜잭션 유닛
        function executePurgeDeleteJobFeedV2(jobId) {
            if(!confirm('원장 파쇄 삭제 경고:\n\n게재 승인된 해당 피크타임 구인공고문 데이터를 전산 원장망에서 강제 영구 삭제 파쇄합니까?\n\n(삭제 즉시 피드판에서 소멸하여 추가 시니어 지원 청약이 원천 동결 차단됩니다)')) return;

            fetch('/api/jobs/purge-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: parseInt(jobId) })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    alert('구인 공고 전산 원장 청정 파쇄 삭제가 최종 성료 완료되었습니다.');
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
