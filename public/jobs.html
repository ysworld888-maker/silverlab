<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 피크타임 공고 탐색</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --toss-blue: #3182f6;
            --toss-blue-hover: #1b64da;
            --toss-bg: #f9fafb;
        }

        body { 
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--toss-bg);
            color: #191f28;
            word-break: keep-all;
        }

        .btn-toss {
            background-color: var(--toss-blue);
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-toss:hover {
            background-color: var(--toss-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(49, 130, 246, 0.35);
        }

        .category-pill {
            transition: all 0.2s ease;
        }

        .category-pill.active {
            background-color: var(--toss-blue);
            color: #ffffff;
            font-weight: 800;
        }

        .input-toss {
            background-color: #ffffff;
            border: 1px solid #e5e8eb;
            transition: all 0.2s ease;
        }

        .input-toss:focus {
            border-color: #3182f6;
            box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-blue-100 selection:text-blue-600">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <!-- Brand Logo (Wave Mark SVG) -->
            <a href="/index.html" class="flex items-center gap-2.5 group">
                <div class="p-1.5 rounded-xl bg-blue-50 text-blue-600 group-hover:bg-blue-100 transition">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900 group-hover:text-blue-600 transition">
                    silverworks
                </span>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="/jobs.html" class="text-blue-600 font-extrabold transition">피크타임 공고</a>
                <a href="/senior-apply.html" class="hover:text-blue-600 transition">시니어 일자리센터</a>
                <a href="/employer.html" class="hover:text-blue-600 transition">사장님 센터</a>
                <a href="/admin.html" class="hover:text-blue-600 transition">관리자 HQ</a>
            </nav>

            <!-- User Actions & Notification Bell SVG -->
            <div class="flex items-center gap-3">
                <a href="/notifications.html" class="relative p-2 text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-full transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-blue-600 rounded-full"></span>
                </a>
                <a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                    로그인
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-5 py-10 flex-1 w-full space-y-8">

        <!-- Search Header -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200/80 shadow-sm space-y-6">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">맞춤 피크타임 일자리 찾기</h1>
                <p class="text-xs text-slate-500 mt-1">원하는 지역, 업종, 체력 검증 요건에 맞는 초단기(2~3시간) 공고를 조회하세요.</p>
            </div>

            <!-- Search Inputs Bar -->
            <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" onkeyup="filterJobs()" placeholder="매장명 또는 공고 제목 검색 (예: 대박식당, 서빙)"
                           class="w-full pl-11 pr-4 py-3.5 rounded-2xl input-toss text-xs font-medium text-slate-900">
                </div>

                <!-- Requirement Checkbox Pill Filters -->
                <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-200 text-xs font-bold text-slate-700">
                    <label class="flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-white cursor-pointer transition">
                        <input type="checkbox" id="filter-fitness" onchange="filterJobs()" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span>체력검증 우대</span>
                    </label>
                    <label class="flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-white cursor-pointer transition">
                        <input type="checkbox" id="filter-health" onchange="filterJobs()" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span>보건증 필수</span>
                    </label>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-bold text-slate-600">
                <button onclick="setCategory('all')" id="cat-all" class="category-pill active px-4 py-2.5 rounded-xl bg-slate-100 whitespace-nowrap">
                    전체 공고
                </button>
                <button onclick="setCategory('식당·서빙')" id="cat-식당·서빙" class="category-pill px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 whitespace-nowrap">
                    식당·서빙
                </button>
                <button onclick="setCategory('카페·음료')" id="cat-카페·음료" class="category-pill px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 whitespace-nowrap">
                    카페·음료
                </button>
                <button onclick="setCategory('마트·운반')" id="cat-마트·운반" class="category-pill px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 whitespace-nowrap">
                    마트·운반
                </button>
            </div>
        </div>

        <!-- Job Grid Container -->
        <div class="space-y-4">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500 px-1">
                <span>총 <strong id="job-count" class="text-blue-600">0</strong>개의 공고가 조회되었습니다.</span>
                <span class="text-slate-400">최신순 정렬</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="jobs-container">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 text-center">
        <p><strong class="text-white">silverworks (실버웍스)</strong> | 대표: 유연성, 민 혁 | 고객센터: 010-7464-3657</p>
        <p class="text-slate-500 text-[11px] mt-1">경기도 성남시 중원구 광명로 79, 4층 404호 (성남동, 상산빌딩)</p>
    </footer>

    <!-- Store & Filter Script -->
    <script>
        const SilverworksStore = {
            getJobs() {
                if (!localStorage.getItem('sw_jobs')) {
                    const defaultJobs = [
                        {
                            id: 'job-1',
                            storeName: '대박식당',
                            title: '[대박식당] 점심 피크시간 홀 서빙 & 보조',
                            category: '식당·서빙',
                            date: '2026-07-26',
                            time: '12:00 ~ 14:00 (2시간)',
                            pay: 30000,
                            status: '1순위 매칭 완료',
                            badgeReq: '체력검증 우대'
                        },
                        {
                            id: 'job-2',
                            storeName: '성남카페',
                            title: '[성남카페] 저녁 음료 컵 세척 & 매장 정리',
                            category: '카페·음료',
                            date: '2026-07-26',
                            time: '18:00 ~ 21:00 (3시간)',
                            pay: 36000,
                            status: '구직자 모집중',
                            badgeReq: '보건증 필수'
                        },
                        {
                            id: 'job-3',
                            storeName: '모란유통',
                            title: '[모란유통] 하차 물품 분류 & 단시간 정리',
                            category: '마트·운반',
                            date: '2026-07-27',
                            time: '08:00 ~ 11:00 (3시간)',
                            pay: 40000,
                            status: '구직자 모집중',
                            badgeReq: '체력검증 우대'
                        }
                    ];
                    localStorage.setItem('sw_jobs', JSON.stringify(defaultJobs));
                }
                return JSON.parse(localStorage.getItem('sw_jobs'));
            }
        };

        let currentCategory = 'all';

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(cat === 'all' ? 'cat-all' : `cat-${cat}`);
            if (target) target.classList.add('active');
            filterJobs();
        }

        function filterJobs() {
            const jobs = SilverworksStore.getJobs();
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const fitFilter = document.getElementById('filter-fitness').checked;
            const healthFilter = document.getElementById('filter-health').checked;

            const filtered = jobs.filter(job => {
                const matchCat = currentCategory === 'all' || job.category === currentCategory;
                const matchKeyword = job.title.toLowerCase().includes(keyword) || job.storeName.toLowerCase().includes(keyword);
                
                let matchFit = true;
                if (fitFilter) {
                    matchFit = job.badgeReq.includes('체력');
                }

                let matchHealth = true;
                if (healthFilter) {
                    matchHealth = job.badgeReq.includes('보건증');
                }

                return matchCat && matchKeyword && matchFit && matchHealth;
            });

            renderJobs(filtered);
        }

        function renderJobs(list) {
            const container = document.getElementById('jobs-container');
            document.getElementById('job-count').innerText = list.length;

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-3xl border border-slate-200/80">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-bold">조건에 해당하는 구인 공고가 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(job => `
                <div class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="bg-blue-50 text-blue-600 text-[11px] font-bold px-2.5 py-1 rounded-lg">${job.category}</span>
                            <span class="text-[11px] font-bold text-slate-400">${job.badgeReq}</span>
                        </div>
                        <h3 class="text-base font-extrabold text-slate-900 leading-snug">${job.title}</h3>
                        <p class="text-xs text-slate-500">
                            근무일시: ${job.date} ${job.time}
                        </p>
                    </div>

                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-slate-400 block font-medium">지급 일당</span>
                            <strong class="text-base font-black text-blue-600">${job.pay.toLocaleString()}원</strong>
                        </div>
                        <a href="/job-detail.html?id=${job.id}" class="btn-toss text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm">
                            상세보기 / 지원
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            filterJobs();
        });
    </script>
</body>
</html>
