<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silverworks - 피크타임 공고 탐색</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", sans-serif; background-color: #f8fafc; color: #1e293b; word-break: keep-all; }
        .btn-sky { background-color: #0ea5e9; color: #ffffff; transition: all 0.2s; }
        .btn-sky:hover { background-color: #0284c7; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2.5">
                <div class="p-1.5 rounded-xl bg-sky-100 text-sky-600">
                    <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 14 58 C 28 72 44 72 58 48 C 72 24 88 18 95 35" />
                        <path d="M 48 70 C 62 82 78 78 86 60" />
                    </svg>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">silverworks</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="/jobs.html" class="text-sky-600 font-extrabold transition">피크타임 공고</a>
                <a href="/senior-apply.html" class="hover:text-sky-600 transition">시니어 일자리센터</a>
            </nav>
            <div id="header-user-area" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-5 py-10 flex-1 w-full space-y-8">
        <div class="bg-white rounded-3xl p-6 border border-sky-100 shadow-sm space-y-4">
            <h1 class="text-2xl font-black text-slate-800">맞춤 피크타임 일자리 찾기</h1>
            <p class="text-xs text-slate-500">원하는 초단기(2~3시간) 공고를 조회하고 실시간 지원하세요.</p>
        </div>

        <div id="jobs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <script>
        function checkPermission() {
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');
            if (user && user.role === 'employer') {
                alert('사장님 회원 권한으로는 공고 탐색 페이지 이용이 제한됩니다.');
                location.href = '/employer.html';
            }
        }

        async function updateHeaderUI() {
            const userArea = document.getElementById('header-user-area');
            const user = JSON.parse(localStorage.getItem('sw_user') || 'null');

            if (!user) {
                userArea.innerHTML = `<a href="/login.html" class="text-xs font-bold px-4 py-2 rounded-xl bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">로그인 및 회원가입</a>`;
                return;
            }

            const usersRes = await fetch('/api/users').then(r => r.json());
            const freshUser = usersRes.users.find(u => u.id === user.id) || user;
            localStorage.setItem('sw_user', JSON.stringify(freshUser));

            const notiRes = await fetch(`/api/notifications/${user.id}`).then(r => r.json());
            const hasUnread = notiRes.hasUnread;

            let html = `
                <a href="/notifications.html" class="relative p-2 text-slate-500 hover:text-sky-600 transition" title="알림 센터">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    ${hasUnread ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-sky-500 rounded-full ring-2 ring-white"></span>` : ''}
                </a>
            `;

            if (freshUser.role === 'senior') {
                html += `
                    <a href="/profile.html" class="text-xs font-extrabold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100 hover:bg-sky-100 transition">
                        포인트 ${(freshUser.points || 0).toLocaleString()}P (정산)
                    </a>
                `;
            }

            html += `
                <a href="/profile.html" class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold border border-sky-200 hover:border-sky-400 transition" title="프로필 페이지">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="handleLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            userArea.innerHTML = html;
        }

        function handleLogout() {
            localStorage.removeItem('sw_user');
            alert('로그아웃 되었습니다.');
            location.href = '/index.html';
        }

        async function renderJobs() {
            const jobsRes = await fetch('/api/jobs').then(r => r.json());
            const jobs = jobsRes.jobs || [];
            const container = document.getElementById('jobs-container');

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-3xl border border-sky-100">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-sky-300"></i>
                        <p class="text-xs font-bold">현재 등록된 구인 공고가 없습니다.</p>
                    </div>`;
                return;
            }

            container.innerHTML = jobs.map(j => `
                <div class="bg-white rounded-3xl p-6 border border-sky-100 shadow-sm flex flex-col justify-between space-y-4">
                    <div class="space-y-2">
                        <span class="bg-sky-50 text-sky-600 text-[11px] font-bold px-2.5 py-1 rounded-lg">${j.category}</span>
                        <h3 class="text-base font-extrabold text-slate-800">${j.title}</h3>
                        <p class="text-xs text-slate-500">일시: ${j.date} ${j.time}</p>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
                        <strong class="text-base font-black text-sky-600">${parseInt(j.pay).toLocaleString()}원</strong>
                        <a href="/job-detail.html?id=${j.id}" class="btn-sky text-xs font-bold px-4 py-2 rounded-xl">상세보기/지원</a>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkPermission();
            updateHeaderUI();
            renderJobs();
        });
    </script>
</body>
</html>
